# Checks city alerts on demand (scripts/check-alerts.mjs), without the rest of the nightly Translate job:
# no event sorting, no translation, and above all no weekend edition, which a Friday run would publish again.
# The nightly Translate job does the same step every night; run this one when an alert can't wait.
name: City alerts
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: translate
env:
  BUCKET: spikinglabs-little-outings
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Download the alert verdicts and decisions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_SORT_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .cache/outings
          for f in alerts.json alert-decisions.json; do
            if npx wrangler r2 object get "$BUCKET/little-outings/$f" --file ".cache/outings/$f.part" > /dev/null 2>&1; then
              mv ".cache/outings/$f.part" ".cache/outings/$f"
            else
              rm -f ".cache/outings/$f.part"; echo "No $f in the bucket."
            fi
          done
      - name: Check city alerts with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ALERTS_MODEL: ${{ vars.ALERTS_MODEL }}
          ALERTS_EXPORT: ${{ vars.ALERTS_EXPORT }}
        run: |
          out=$(npm run --silent check:alerts 2>&1) || { echo "$out"; exit 1; }
          echo "$out"; echo "::notice title=City alerts::$(echo "$out" | tail -1)"
      - name: Save the alert verdicts for the admin
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_SORT_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object put "$BUCKET/little-outings/alerts.json" --file .cache/outings/alerts.json --content-type application/json
      - name: Commit the confirmed alerts
        run: |
          git add data/alerts.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update city alerts"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
