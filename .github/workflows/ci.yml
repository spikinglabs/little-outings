name: CI
# Pull requests only: main gets exactly what its pull request passed, and the Deploy run on
# the same pull request builds the site, so this job skips that build (Actions minutes).
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run check
      # Validates every content file against the schemas and builds the demo pages; the real
      # site is built by the Deploy run of the same pull request.
      - run: npm run build:demo
