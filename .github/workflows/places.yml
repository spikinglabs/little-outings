# Refreshes data/places-osm.jsonl from OpenStreetMap once a week (Overpass API).
# The nightly deploy then builds place pages from it (scripts/import-places.mjs).
# On a pull request that touches the fetcher it only fetches and reports the counts.
name: Places
on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [scripts/fetch-osm-places.mjs, .github/workflows/places.yml]
permissions:
  contents: write
concurrency:
  group: places-${{ github.ref }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch OpenStreetMap places
        id: fetch
        run: |
          for i in 1 2 3; do
            if out=$(npm run --silent fetch:osm 2>&1); then break; fi
            echo "$out"; [ $i = 3 ] && exit 1; sleep $((i * 60))
          done
          echo "$out"
          echo "::notice title=OpenStreetMap::$out"
      - name: Check the import
        run: npm run import:places
      - name: Commit the refreshed list
        if: github.event_name != 'pull_request'
        run: |
          git add data/places-osm.jsonl
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh OpenStreetMap places"
          git push
