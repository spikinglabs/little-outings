# Deploys the site to Cloudflare Pages.
#   push to main        → production
#   pull request        → preview URL (shown in the job summary)
#   every night 02:15   → import the cityklub export, then rebuild production
#                         (dates like "today" and "this weekend" move every day)
# Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them the deploy step is skipped and the run stays green.
name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  deployments: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT: little-outings

jobs:
  import:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Import the cityklub public export
        if: ${{ vars.CITYKLUB_EXPORT != '' }}
        env:
          CITYKLUB_EXPORT: ${{ vars.CITYKLUB_EXPORT }}
        run: npm run import:cityklub
      - name: Check the import still builds
        run: npm run build
      - name: Commit changed imports
        run: |
          git config user.name "little-outings bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/imported
          git diff --cached --quiet || git commit -m "Nightly cityklub import"
          git push

  deploy:
    needs: import
    # Runs after the import on schedules, and on its own for pushes and PRs.
    if: always() && needs.import.result != 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On a schedule, pick up the import commit made a moment ago.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Missing repository secret(s):$missing; skipping deploy."; fi
      - name: Create the Pages project if it doesn't exist
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>&1 | tail -2 || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uploads dist/ and the Pages Functions in functions/.
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - name: Show the URL
        if: steps.cf.outputs.ok == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
