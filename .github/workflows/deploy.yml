# Deploys the site and the admin to Cloudflare Pages.
#   push to main        → production (site and admin)
#   pull request        → site preview URL (job summary, and a comment on the PR)
#   every night 02:15   → rebuild production, so "today" and "this weekend" move
# Every build imports cityklub events first: data/outings.jsonl (published from the
# admin) when present, otherwise the CITYKLUB_EXPORT variable.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID
# as a secret or a variable (the account ID is not sensitive).
# Without them the deploy steps are skipped and the run stays green.
name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT: little-outings

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Import cityklub events
        env:
          CITYKLUB_EXPORT: ${{ vars.CITYKLUB_EXPORT }}
        run: npm run import:cityklub
      - name: Import places (OpenStreetMap, farms)
        run: npm run import:places
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Missing (token must be under Secrets, not Variables):$missing; skipping deploy."; fi
      - name: Create the Pages project if it doesn't exist
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>&1 | tail -2 || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          # Uploads dist/ and the Pages Functions in functions/.
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - name: Show the URL
        if: steps.cf.outputs.ok == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the pull request
        if: steps.cf.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # The branch alias stays the same for every push; the deployment URL is this exact build.
          ALIAS: ${{ steps.deploy.outputs.deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          body="Preview: ${ALIAS:-$URL}"
          [ -n "$ALIAS" ] && body="$body (follows this PR; this build: $URL)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview:"))) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  admin:
    # The admin only ships from main; previews would share its bucket binding.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ADMIN_PROJECT: little-outings-admin
    steps:
      - uses: actions/checkout@v4
      - run: cp design/tokens.css admin/public/tokens.css
      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare credentials missing; skipping the admin deploy."; fi
      - name: Create the admin Pages project if it doesn't exist
        if: steps.cf.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$ADMIN_PROJECT" --production-branch main 2>&1 | tail -2 || true
      - name: Deploy the admin
        if: steps.cf.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          # Uploads admin/public and the Functions in admin/functions; bindings come from admin/wrangler.toml.
          command: pages deploy --project-name=${{ env.ADMIN_PROJECT }} --branch=main
