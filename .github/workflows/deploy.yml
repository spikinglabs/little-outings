# Deploys the site and the admin to Cloudflare Pages.
#   push to main        → production (site and admin)
#   pull request        → site preview URL (job summary, and a comment on the PR)
#   every night 02:15   → rebuild production, so "today" and "this weekend" move
# Every build imports cityklub events first: data/outings.jsonl (published from the
# admin) when present, otherwise the CITYKLUB_EXPORT variable. Places come from the
# PLACES_EXPORT variable (public places bucket, filled monthly by spikinglabs/osm-family-data),
# with data/places-osm.jsonl as the fallback; no build waits on OpenStreetMap's Overpass.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID
# as a secret or a variable (the account ID is not sensitive).
# Optional: variable INBOX_REPO + secret INBOX_READ_TOKEN (Issues: read) to count tips and older answers;
# chip votes and "We went" come from the live site's /api/taps (Cloudflare D1, binding DB).
# Without them the deploy steps are skipped and the run stays green.
name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT: little-outings

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Nominatim answers are kept between builds, so only new addresses wait a second each.
      - uses: actions/cache@v4
        with:
          path: .cache/pins.json
          key: pins-${{ github.run_id }}
          restore-keys: pins-
      # Events that came without a point are pinned from their street, venue or district.
      - name: Import cityklub events
        env:
          CITYKLUB_EXPORT: ${{ vars.CITYKLUB_EXPORT }}
          PINS_CACHE: .cache/pins.json
        run: |
          mkdir -p .cache
          out=$(npm run --silent import:cityklub 2>&1) || { echo "$out"; exit 1; }
          echo "$out"; echo "::notice title=Event pins::$(echo "$out" | tail -1)"
      - name: Import places (OpenStreetMap, farms)
        env:
          PLACES_EXPORT: ${{ vars.PLACES_EXPORT }}
        run: |
          out=$(npm run --silent import:places 2>&1) || { echo "$out"; exit 1; }
          echo "$out"; echo "::notice title=Places::$(echo "$out" | tail -1)"
      # Toilets, changing tables and drinking water: next to PLACES_EXPORT unless TOILETS_EXPORT says otherwise.
      - name: Import toilets (OpenStreetMap)
        env:
          PLACES_EXPORT: ${{ vars.PLACES_EXPORT }}
          TOILETS_EXPORT: ${{ vars.TOILETS_EXPORT }}
        run: |
          out=$(npm run --silent import:toilets 2>&1); echo "$out"
          echo "::notice title=Toilets::$(echo "$out" | tail -1)"
      # The next week's weather per town for Discover and event pages (free, no key). Never fails the build.
      - name: Fetch the weather (Open-Meteo)
        run: |
          out=$(npm run --silent fetch:weather 2>&1); echo "$out"
          echo "::notice title=Weather::$(echo "$out" | tail -1)"
      - name: Pin parents' places (Nominatim)
        env:
          PINS_CACHE: .cache/pins.json
        run: |
          out=$(npm run --silent geocode:places 2>&1); echo "$out"
          echo "::notice title=Place pins::$(echo "$out" | tail -1)"
      - name: Count parents' answers from the inbox
        env:
          INBOX_REPO: ${{ vars.INBOX_REPO }}
          INBOX_READ_TOKEN: ${{ secrets.INBOX_READ_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run tally:inbox
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      # Cloudflare Pages refuses a deploy of more than 20,000 files; warn well before that.
      - name: Count files
        run: |
          n=$(find dist -type f | wc -l)
          echo "::notice title=Files::$n of 20,000"
          [ "$n" -lt 17000 ] || echo "::warning title=Files::$n files; Cloudflare Pages takes at most 20,000. Every place is a page per language (event pages are packed, see src/lib/page-packs.ts)."
      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Missing (token must be under Secrets, not Variables):$missing; skipping deploy."; fi
      # Only on a manual run: the project exists, and this step alone took about 13 seconds.
      - name: Create the Pages project if it doesn't exist
        if: steps.cf.outputs.ok == 'true' && github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>&1 | tail -2 || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          # Use the wrangler that npm ci installed from package-lock.json. Letting the action
          # run its own `npm i wrangler` here dropped workerd's Linux binary and failed the deploy.
          wranglerVersion: "3.114.17"
          # Uploads dist/ and the Pages Functions in functions/.
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      # Bing (ChatGPT search, Copilot, DuckDuckGo) hears about new pages at once; the list of sent URLs is kept between runs.
      - uses: actions/cache@v4
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        with:
          path: .cache/indexnow-sent.txt
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - name: Tell search engines about new pages (IndexNow)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          out=$(npm run --silent indexnow 2>&1); echo "$out"
          echo "::notice title=IndexNow::$(echo "$out" | tail -1)"
      - name: Show the URL
        if: steps.cf.outputs.ok == 'true'
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the pull request
        if: steps.cf.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # The branch alias stays the same for every push; the deployment URL is this exact build.
          ALIAS: ${{ steps.deploy.outputs.deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          body="Preview: ${ALIAS:-$URL}"
          [ -n "$ALIAS" ] && body="$body (follows this PR; this build: $URL)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview:"))) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  admin:
    # The admin only ships from main; previews would share its bucket binding.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ADMIN_PROJECT: little-outings-admin
    steps:
      - uses: actions/checkout@v4
      - run: cp design/tokens.css admin/public/tokens.css
      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare credentials missing; skipping the admin deploy."; fi
      - name: Create the admin Pages project if it doesn't exist
        if: steps.cf.outputs.ok == 'true' && github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$ADMIN_PROJECT" --production-branch main 2>&1 | tail -2 || true
      - name: Deploy the admin
        if: steps.cf.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          # Uploads admin/public and the Functions in admin/functions; bindings come from admin/wrangler.toml.
          command: pages deploy --project-name=${{ env.ADMIN_PROJECT }} --branch=main
