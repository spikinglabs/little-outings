    free: true
    website: https://www.koeln.de/weihnachten/weihnachtsmaerkte-koeln/weihnachtsmarkt-altstadt/
    note:
      de: "Eislandschaft auf dem Heumarkt, für Kinder ein kleines Riesenrad und ein historisches Karussell. Der Alter Markt schließt am 23.12., der Heumarkt bleibt bis 10.1."
      en: "An ice rink across the Heumarkt, and a small Ferris wheel and historic carousel for children. Alter Markt closes on 23 Dec, Heumarkt stays open until 10 Jan."
      zh: "Heumarkt广场上有溜冰场，还有给孩子的小摩天轮和老式旋转木马。Alter Markt部分12月23日结束，Heumarkt开到1月10日。"
