      de: "Kinder können basteln, Kasperletheater sehen, sich schminken lassen und auf dem historischen Karussell fahren."
      en: "Children can do crafts, watch a Punch and Judy show, get their faces painted and ride the historic carousel."
      zh: "孩子们可以做手工、看木偶剧、画脸，还能坐老式旋转木马。"
