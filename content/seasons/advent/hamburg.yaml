    free: true
    website: https://www.hamburg.de/tourismus/weihnachten-hamburg/weihnachtsmarkt-hamburg/weihnachtsmarkt-rathausmarkt-301092
    note:
      de: "Täglich um 16, 18 und 20 Uhr fliegt der Weihnachtsmann mit Schlitten über den Markt. Historisches Karussell; an den Advents-Samstagen um 14 und 17 Uhr Weihnachtsparade in der Mönckebergstraße."
      en: "Father Christmas flies over the market on his sleigh daily at 4, 6 and 8 pm. A historic carousel, and a Christmas parade on Mönckebergstraße on Advent Saturdays at 2 and 5 pm."
