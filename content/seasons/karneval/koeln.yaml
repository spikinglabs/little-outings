    note:
      de: "Schulen, Kitas und Vereine aus den Veedeln ziehen zu Fuß über den Weg des Rosenmontagszugs, mit selbst gebauten Kostümen. Der Kinderzug schlechthin, und ruhiger als Rosenmontag."
      en: "Schools, Kitas and clubs from the neighbourhoods walk the Rosenmontag route in home-made costumes. The parade for children, and calmer than Rosenmontag."
      zh: "各街区的学校、幼儿园和社团穿着自制服装，沿玫瑰星期一游行路线步行。最适合孩子的游行，比玫瑰星期一安静。"
