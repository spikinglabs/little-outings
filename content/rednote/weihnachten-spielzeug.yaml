cards:
  - tone: red
    tag: 圣诞季 · 投票
    title: "圣诞给娃\n买什么玩具？"
    big: true
    lines:
      - 德国家庭常送的6类玩具，各有什么好？
      - 最后一张投票，评论区见！
    foot: 德国带娃 · 圣诞季
  - tone: green
    tag: 德国习俗
    title: 礼物是谁送的？
    lines:
      - 很多德国家庭12月24日晚上拆礼物（Bescherung），不是25日早上。
      - 南部和西部很多地方说是 Christkind（圣婴）送的，北部更多说是 Weihnachtsmann（圣诞老人）。
      - 12月6日尼古拉斯节，孩子前一晚把靴子放门口，第二天早上有小零食和小礼物。
    note: 你家呢？谁送礼物，24日晚上拆还是25日早上拆？评论区说说～
  - tone: rose
    tag: A 积木拼搭
    title: 搭了拆，拆了搭
    lines:
      - 大颗粒积木、木头积木、磁力片，适合小一点的孩子。
      - 小颗粒积木适合大一点的孩子，盒子上有建议年龄。
      - 好处：一套能玩好几年，还能和新的混着玩。
  - tone: sky
    tag: B 角色扮演
    title: 过家家永远不过时
    lines:
      - 玩具厨房、娃娃屋、小医生箱、工具箱，还有小人场景玩具。
      - 孩子模仿大人做饭、看病、修东西，常常一玩就是很久。
      - 好处：能和兄弟姐妹、朋友一起玩。
  - tone: mint
    tag: C 桌游拼图
    title: 德国是桌游大国
    lines:
      - 德国每年评「年度儿童游戏」（Kinderspiel des Jahres），可以按这个挑。
      - 拼图从几块到几百块都有，按盒子上的年龄选。
      - 好处：全家一起玩，冬天晚上特别合适。
  - tone: green
    tag: D 户外 · E 故事机
    title: 跑起来，听起来
    lines:
      - D 户外运动：平衡车、滑板车、雪橇。德国孩子很多很小就骑平衡车。
      - E 故事机和绘本：孩子自己就能操作故事机，随时听故事；绘本可以中德双语一起读。
  - tone: rose
    tag: F 手工画画
    title: 动手做点什么
    lines:
      - 黏土、贴纸书、水彩、串珠，还有做灯笼和圣诞装饰的手工包。
      - 好处：便宜，适合当小礼物，也适合放进 Adventskalender。
  - tone: paper
    tag: 买之前看一眼
    title: 德国买玩具小提示
    lines:
      - 在欧盟卖的玩具必须有 CE 标志，没有的别买。
      - 「spiel gut」标志：由专家委员会评选，表示这个玩具耐玩、适合孩子。
      - 二手玩具可以去 Kinderbasar（儿童二手市场）或者网上二手平台淘。
    note: 买之前也可以查一下有没有被召回。
  - tone: ink
    title: "你家投哪类？"
    lines:
      - 评论区留字母，也欢迎分享买了后悔或越玩越香的玩具。
