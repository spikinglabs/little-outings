# A Rednote (小红书) set for discussion: what toys to give children for Christmas, as a vote over six kinds of toy.
# Customs and labels as generally documented (Christkind / Weihnachtsmann, Nikolaus on 6 Dec, CE mark, "spiel gut",
# Kinderspiel des Jahres); no brand names at all (L, 2026-11-12). Colourful seasonal tones (L, 2026-11-12).
# Public comments: ask for favourites and tips, never about the children themselves.
# After changing Chinese text here, rerun scripts/og-font.py so the font has every character.
title: 圣诞给娃买什么玩具？投票｜2026
until: 2026-12-24
caption: |
  圣诞快到了🎄 每年最纠结的问题：给娃买什么玩具？
  鹿小游整理了德国家庭常送的6类玩具，各有什么好，来评论区投票（A–F）👇

  A 积木拼搭：小颗粒积木、木头积木、磁力片
  B 角色扮演：厨房、娃娃屋、小医生
  C 桌游拼图：德国是桌游大国
  D 户外运动：平衡车、滑板车、雪橇
  E 故事机和绘本：听故事、学德语
  F 手工画画：黏土、贴纸、做灯笼

  🗳 你家今年选哪类？评论区留字母就行。
  也想听听大家的：
  · 有没有买了后悔、或者越玩越香的玩具？
  · 你家的礼物是 Christkind 送，还是 Weihnachtsmann 送？24日晚上拆还是25日早上拆？
  · 玩具太多了，大家怎么收纳、怎么断舍离？

  冬天带娃去哪：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
