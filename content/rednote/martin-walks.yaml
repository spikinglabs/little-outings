title: 圣马丁灯笼游行｜德国6城时间地点
until: 2026-11-14
caption: |
  11月11日圣马丁节快到了🏮 鹿小游给游友们整理了 6 个城市的灯笼游行👇
  大多数免费，不用报名

  📍科隆
  ①【11.6 周五 17:00】大教堂礼拜后游行到 Groß St. Martin，发 Weckmann
  ②【11.6 周五 17:45】FC 足球场游行，RheinEnergieSTADION（免费送灯笼和 Weckmann）
  ③【11.7 周六 17:00】Gut Leidenhausen 森林灯笼徒步
  ④【11.8 周日 18:00】Auweiler，Doktorshof 出发

  📍法兰克福
  ①【11.10 周二 17:00】Eckenheim 和 Praunheim
  ②【11.11 周三 17:00】Westend，St. Ignatius 教区
  ③【11.11 周三 18:00】老城游行，Römerberg 的 Alte Nikolaikirche 出发
  ④【11.11 周三 18:00】最大的圣马丁篝火和皮影戏，Günthersburgpark（免费）

  📍汉堡
  ①【10.31 周六 18:30】Niendorf，Fuhlsbütteler Weg 5
  ②【11.7 周六 18:00】Berne，Berner Gutspark（有烟花）
  ③【11.8 周日 18:15】Harburg 大游行（19点左右有烟花）
  ④【11.14 周六 15:00】Volksdorf（有骑马的圣马丁）

  📍柏林
  ①【11.4–11.8、11.11 15:45】Tierpark Berlin 动物园提灯游行

  📍慕尼黑
  ①【11.8 周日 17:00】Denning 教会联合灯笼游行
  ②【11.11 周三 16:30】市中心圣马丁游行，Frauenplatz

  📍波恩
  ①【11.4 周三 16:30】市中心大游行，Münsterplatz
  ②【11.8 周日 12:15】和圣马丁一起唱歌，Josefplatz

  幼儿园和学校的游行常常只给本园家庭，去之前最好问一下主办方。

  活动信息以主办方为准，出发前请再确认～
  更多游行：浏览器搜索「小鹿出游 Allo Outings」，选你的城市，点「圣马丁灯笼游行」。
