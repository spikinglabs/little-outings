  - tone: paper
    tag: A 玛利亚广场
    title: 天堂工坊：扮小天使做手工
    lines:
      - 新市政厅里的 Himmelswerkstatt，6–12岁，11-26到12-13每天两场：14:30–16点、16:30–18点，免费。
      - 孩子可以扮成小天使，做卡片或蜡烛。
      - 要提前在 Kindermuseum München 报名，每场提前10天开放。
    note: 市场周一到周六10–21点，周日10–20点，12-24开到14点。
  - tone: paper
    tag: B Residenz 王宫
    title: 免费的童话森林
    lines:
      - 王宫的 Kaiserhof 里，按一下按钮，小红帽、霍勒大妈等童话就动起来。免费入场，每天11–21点。
      - 木偶剧：11-23、11-30、12-08、12-14，15–16点。
      - 画脸：11-24、12-01、12-09、12-15，16–18点。
      - 尼古拉斯：12-06和12-07，17点起送小礼物（送完为止）。
  - tone: paper
    tag: C 中国塔
    title: 小火车和马车
    lines:
      - 在英国花园里，有老式儿童旋转木马和儿童小火车。
      - 周四到周日13点起可以坐马车游花园。12-05和12-06尼古拉斯来。
      - 注意：周一周二不开（12-21到23每天开）。
  - tone: paper
    tag: D Märchenbazar
    title: 童话帐篷，全免费
    lines:
      - 在奥林匹克公园南，免费入场。
      - 每天有免费儿童节目：讲童话、做蜡烛、木偶剧、手工。
      - 工作日14点开，周六12点、周日11点开，12-24不开。
  - tone: paper
    tag: E Stachus · 换尿布
    title: 溜冰和换尿布
    lines:
      - E Stachus 溜冰场：11-13到1月10日，在市中心。
      - 玛利亚广场：旁边 Galeria 百货有换尿布台（约110米）。
      - Stachus：旁边 dm 有换尿布台（约150米）。
      - 中国塔：旁边餐厅有换尿布台（约80米，开到18点）。
