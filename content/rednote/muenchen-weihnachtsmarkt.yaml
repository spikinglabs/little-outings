# A Rednote (小红书) set: Munich's Christmas markets for families. Every date, hour and children's offer checked
# on muenchen.de and the markets' own sites on 2026-11-12; changing tables from OpenStreetMap (places/toilets.jsonl).
# Drawn at /xhs/muenchen-weihnachtsmarkt-<n>.png until `until`; the admin's Rednote box shows it with the caption.
# Ends on a vote so parents talk in the comments (public: ask for favourites and tips, never about their kids).
# After changing Chinese text here, rerun scripts/og-font.py so the font has every character.
title: 慕尼黑圣诞市场带娃哪个最好？｜2026
until: 2026-12-28
caption: |
  慕尼黑的圣诞市场11-13起陆续开门🎄 鹿小游按官方信息挑了5个适合带娃的，看完来评论区投票（A–E）👇

  A 【11-20起】玛利亚广场：6–12岁"天堂工坊"免费做手工（要报名）
  B 【11-16起】Residenz 王宫：免费童话森林、木偶剧、画脸
  C 【11-19起】中国塔：老式旋转木马、儿童小火车、马车（周一周二不开）
  D 【11-26起】Märchenbazar：每天免费讲童话、做蜡烛、木偶剧
  E 【11-13起】Stachus：市中心溜冰场

  小提示：11-22（周日，Totensonntag）玛利亚广场和王宫不开。12-13 15–17点老城有坎卜斯（Krampus）游行，几百个"恶魔"，小小孩可能会怕。

  🗳 你家投哪个？评论区留下字母就行。
  也想听听大家的经验：白天去还是晚上去？推车还是背带？坎卜斯游行你家娃怕不怕？

  时间以官方为准，出发前请再确认～
  更多市场：浏览器搜索「小鹿出游 Allo Outings」，选慕尼黑，点「圣诞市场」。
