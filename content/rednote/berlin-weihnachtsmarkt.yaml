# A Rednote (小红书) set: Berlin's Christmas markets for families. Every date, hour, price and children's offer
# checked on the market's berlin.de page on 2026-11-12; changing table from OpenStreetMap (places/toilets.jsonl).
# Drawn at /xhs/berlin-weihnachtsmarkt-<n>.png until `until`; the admin's Rednote box shows it with the caption.
# Ends on a vote so parents talk in the comments (public: ask for favourites and tips, never about their kids).
# After changing Chinese text here, rerun scripts/og-font.py so the font has every character.
title: 柏林圣诞市场带娃哪个最好？｜2026
until: 2026-12-30
caption: |
  柏林的圣诞市场11-13起陆续开门🎄 鹿小游按官方信息挑了6个适合带娃的，看完来评论区投票（A–F）👇

  A 【11-23起】红色市政厅：海神喷泉溜冰场、50米摩天轮
  B 【11-23起】夏洛滕堡宫：两个儿童旋转木马和小摩天轮
  C 【11-23起】Kulturbrauerei：圣诞老人每天来，骑士城堡
  D 【11-23起】Zehlendorf：小溜冰场，周末舞台节目
  E 【11-28起，只有周末】Späth 苗圃：格林童话剧、坐马车
  F 【12-04起，只有周末】Lehmanns 农场：看动物、骑小马

  小提示：农场和苗圃只开几个周末，日期见第5、6张。

  🗳 你家投哪个？评论区留下字母就行。
  也想听听大家的经验：白天去还是晚上去？推车还是背带？有没有人少的私藏小市场？

  时间以官方为准，出发前请再确认～
  更多市场：浏览器搜索「小鹿出游 Allo Outings」，选柏林，点「圣诞市场」。
