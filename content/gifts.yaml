# Gift ideas for children: annual passes, vouchers and animal sponsorships per town
# (src/lib/gifts.ts, page /<lang>/geschenke/). Every item was checked on the provider's own page on the `checked`
# date. No prices: they change and the link shows today's. No shops, no products, no brands.
#
#   town      as the region files spell it (Köln, Frankfurt am Main); slug is the #anchor on the page
#   items     kind: pass (annual pass), voucher (gift voucher), sponsor (animal sponsorship)
#             name: the venue and offer as it calls itself; place: a place id when we have its page
#             note: one line on what the child gets; url: the provider's page where it is sold or explained

