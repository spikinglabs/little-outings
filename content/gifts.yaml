# German gift customs for families new to Germany (the Chinese pages show this part first).
customs:
  - id: advent
    emoji: "🗓️"
    when: { de: 1.–24. Dezember, en: 1–24 December, zh: 12月1日至24日 }
    title: { de: Adventskalender, en: Advent calendar, zh: 降临节日历 }
    text:
      de: "Jeden Tag ein Türchen bis Heiligabend. Viele Eltern füllen 24 kleine Säckchen selbst, mit Kleinigkeiten oder einem Zettel für einen Ausflug."
      en: "One little door a day until Christmas Eve. Many parents fill 24 small bags themselves, with small things or a note for an outing."
      zh: "从12月1日起每天开一个小格子，一直到平安夜。很多家长自己装24个小袋子，放小东西，或者放一张“这周去哪玩”的小纸条。"
  - id: nikolaus
    emoji: "🥾"
    when: { de: 5./6. Dezember, en: 5–6 December, zh: 12月5日晚至6日 }
    title: { de: Nikolaus, en: St. Nicholas, zh: 圣尼古拉斯节 }
    text:
      de: "Am Abend des 5. Dezember stellen Kinder geputzte Stiefel vor die Tür. Am Morgen liegen Nüsse, Mandarinen, Schokolade oder eine Kleinigkeit darin. In vielen Kitas kommt der Nikolaus zu Besuch."
      en: "On the evening of 5 December, children put cleaned boots outside the door. In the morning there are nuts, tangerines, chocolate or a small present in them. Many Kitas get a visit from St. Nicholas."
      zh: "12月5日晚上，孩子把擦干净的靴子放在门口，第二天早上靴子里会有坚果、橘子、巧克力或小礼物。很多幼儿园这天会有“圣尼古拉斯”来访。"
  - id: heiligabend
    emoji: "🎁"
    when: { de: 24. Dezember, en: 24 December, zh: 12月24日 }
    title: { de: Heiligabend und Bescherung, en: Christmas Eve, zh: 平安夜拆礼物 }
    text:
      de: "In Deutschland gibt es die Geschenke meist schon am Abend des 24., nicht am Morgen des 25. In vielen Familien bringt sie das Christkind, in anderen der Weihnachtsmann."
      en: "In Germany presents are usually opened on the evening of the 24th, not the morning of the 25th. In many families the Christkind brings them, in others Father Christmas."
      zh: "德国一般在24日晚上就拆礼物，而不是25日早上。很多家庭说礼物是“圣婴（Christkind）”送来的，也有家庭说是圣诞老人。"
  - id: wichteln
    emoji: "🎲"
    when: { de: Dezember, en: December, zh: 12月 }
    title: { de: Wichteln, en: Secret Santa, zh: 抽签互送小礼物 }
    text:
      de: "In Klassen und Kitas zieht jedes Kind einen Namen und schenkt eine Kleinigkeit. Den Betrag legen die Eltern oder die Erzieher vorher fest."
      en: "In classes and Kitas each child draws a name and gives a small present. Parents or teachers agree the amount beforehand."
      zh: "班级或幼儿园里每个孩子抽一个名字，给对方准备一份小礼物。金额通常由家长或老师事先约定。"
  - id: geburtstag
    emoji: "🎂"
    when: { de: Das ganze Jahr, en: All year, zh: 全年 }
    title: { de: Kindergeburtstag, en: Children's birthday parties, zh: 孩子的生日会 }
    text:
      de: "Gäste bringen ein Geschenk mit; was üblich ist, klärt man am besten im Elternchat. Manchmal legen mehrere Familien für ein größeres Geschenk zusammen. Am Ende bekommt jedes Gastkind ein kleines Mitgebsel."
      en: "Guests bring a present; the parents' chat is the best place to ask what is usual. Sometimes several families club together for a bigger one. At the end each guest gets a small goody bag (Mitgebsel)."
      zh: "受邀的孩子要带礼物，多少钱合适最好在家长群里问一下；有时几家会凑钱送一份大礼物。生日会结束时，主人家会给每个小客人一个小礼物袋（Mitgebsel）。"
  - id: schultuete
    emoji: "🎒"
    when: { de: Einschulung, en: First day of school, zh: 入学第一天 }
    title: { de: Schultüte, en: School cone, zh: 入学礼筒 }
    text:
      de: "Zum ersten Schultag bekommen Kinder eine große Tüte mit Süßem und Schulsachen. Oft wird sie im letzten Kita-Jahr gemeinsam gebastelt."
      en: "On the first day of school children get a big cone of sweets and school things. It is often made together in the last Kita year."
      zh: "上小学第一天，孩子会收到一个装满糖果和文具的大纸筒。很多幼儿园会在最后一年带家长一起做。"
