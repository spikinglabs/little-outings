about:
  link: Daten und Datenschutz
  title: Daten und Datenschutz
  intro: Woher Little Outings seine Angaben hat und wo deine Antworten und dein Profil liegen.
  events: { h: Termine, p: "Termine stammen aus den öffentlichen Kalendern von Städten, Büchereien, Museen und Höfen. Wir nutzen nur Fakten wie Titel, Datum, Uhrzeit und Ort, mit Link zur Originalseite. Zeiten und Preise bitte dort prüfen." }
  places: { h: Orte, p: "Spielplätze, Bäder, Museen, Höfe und andere Orte stammen aus OpenStreetMap (© OpenStreetMap-Mitwirkende, ODbL) und werden wöchentlich aktualisiert. Sobald Eltern etwas ergänzt haben, zeigt der Ort, wie viele Antworten es gibt." }
  translate: { h: Übersetzungen und Hinweise, p: "Chinesische Namen sind maschinell übersetzt; der deutsche Name steht darunter. „Braucht man Deutsch?“ ist zuerst aus dem Titel geschätzt und mit „?“ markiert. Sobald Eltern antippen, gilt die häufigste Antwort." }
  taps: { h: Deine Klicks, p: "Antworten zu Ausstattung, „Wir waren da“ und „Braucht man Deutsch?“ werden anonym bei Cloudflare gezählt. Jeder Browser hat eine Zufalls-ID: Eine Frage zählt einmal, eine neue Antwort ersetzt die alte. IP-Adressen werden nur als Hash gespeichert, gegen Massenklicks." }
  writing: { h: Was du schreibst, p: "Tipps, Fehlermeldungen und vorgeschlagene Orte prüfen wir zuerst; sie erscheinen erst nach Freigabe. Bitte keine Namen, Telefonnummern oder andere persönliche Angaben." }
  profile: { h: Dein Profil, p: "Merkliste, besuchte Orte und deine Antworten bleiben im Browser dieses Handys. Kein Konto, keine E-Mail. Unter „Meins“ und dann „Profil und Sync“ kannst du es herunterladen, auf ein anderes Handy umziehen oder löschen. Mit Passkey-Sync liegt eine Kopie auf dem Server, die mit dem Profil gelöscht wird." }
  none: { h: Was wir nicht tun, p: "Keine Werbung, kein Tracking, keine Statistik-Tools, kein Datenverkauf, keine Namen oder E-Mails." }
  wrong: { h: Etwas falsch?, p: "Unten auf jeder Termin- und Ortsseite steht „Stimmt etwas nicht?“. Tipp drauf und sag es uns." }
  who: { h: Wer steckt dahinter, p: "Little Outings ist ein Produkt von Spiking Labs. Spiking Labs macht auch andere Apps für den Alltag, alle zu sehen auf der Website von Spiking Labs." }
