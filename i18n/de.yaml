about:
  link: Daten und Datenschutz
  intro: Woher Little Outings seine Angaben hat und wo deine Antworten und dein Profil liegen.
  events: { h: Termine, p: "Termine stammen aus den öffentlichen Kalendern von Städten, Büchereien, Museen und Höfen. Wir nutzen nur Fakten wie Titel, Datum, Uhrzeit und Ort, mit Link zur Originalseite. Zeiten und Preise bitte dort prüfen." }
  places: { h: Orte, p: "Spielplätze, Bäder, Museen, Höfe und andere Orte stammen aus OpenStreetMap (© OpenStreetMap-Mitwirkende, ODbL) und werden wöchentlich aktualisiert. Sobald Eltern etwas ergänzt haben, zeigt der Ort, wie viele Antworten es gibt." }
  translate: { h: Übersetzungen und Hinweise, p: "Chinesische Namen und englische Veranstaltungstitel sind maschinell übersetzt; der deutsche Name steht darunter. „Braucht man Deutsch?“ ist zuerst aus dem Titel geschätzt und mit „?“ markiert. Sobald Eltern antippen, gilt die häufigste Antwort." }
  taps: { h: Deine Klicks, p: "Antworten zu Ausstattung, „Wir waren da“ und „Braucht man Deutsch?“ werden anonym bei Cloudflare gezählt. Jeder Browser hat eine Zufalls-ID: Eine Frage zählt einmal, eine neue Antwort ersetzt die alte. IP-Adressen werden nur als Hash gespeichert, gegen Massenklicks." }
  writing: { h: Was du schreibst, p: "Tipps, Fehlermeldungen und vorgeschlagene Orte prüfen wir zuerst; sie erscheinen erst nach Freigabe. Antworten bei „Fehlt noch“ (Öffnungszeiten, Uhrzeit, Preis) erscheinen, sobald zwei Eltern dasselbe antworten oder wir sie geprüft haben. Bitte keine Namen, Telefonnummern oder andere persönliche Angaben." }
  ai: { h: Mit deinem KI-Assistenten, p: "Frag Claude, ChatGPT oder einen anderen Assistenten nach Ideen von Little Outings: Füge {url} als eigenen Connector hinzu (bei Claude: Einstellungen → Konnektoren; bei ChatGPT: Einstellungen → Apps, Entwicklermodus). Ohne Anmeldung. Dein Assistent kann dann Termine und Orte suchen und für dich einen Tipp oder einen neuen Termin schicken; den prüfen wir wie alles andere zuerst. Manche Assistenten brauchen für eigene Connectoren ein Bezahl-Abo." }
  profile: { h: Dein Profil, p: "Merkliste, besuchte Orte und deine Antworten bleiben im Browser dieses Handys. Kein Konto, keine E-Mail. Unter „Meins“ und dann „Profil und Sync“ kannst du es herunterladen, auf ein anderes Handy umziehen oder löschen. Mit Passkey-Sync liegt eine Kopie auf dem Server, die mit dem Profil gelöscht wird." }
  location: { h: Dein Standort, p: "Neben „Rund um“ gibt es einen kleinen Standort-Knopf. Nur wenn du ihn antippst, fragt dein Handy, ob es den ungefähren Standort teilen darf, um den nächsten Ort zu wählen. Der Standort bleibt auf deinem Handy und wird nie an uns gesendet; der Ort wird gespeichert wie ein selbst gewählter Ort. Die Karte zeigt dann mit einem blauen Punkt, wo du bist, bis du den Tab schließt oder selbst einen Ort wählst. Ohne ihn startet „Rund um“ bei Köln." }
  stats: { h: Besuche zählen, p: "Seitenaufrufe zählen wir mit Cloudflare Web Analytics, ohne Cookies und ohne Besucher auseinanderzuhalten. Außerdem zählen wir ein paar Klicks wie Merken oder Route öffnen, nur als Tagessumme. Beides weiß nicht, wer du bist." }
  none: { h: Was wir nicht tun, p: "Keine Werbung, keine Cookies, kein seitenübergreifendes Tracking, kein Datenverkauf, keine Namen oder E-Mails." }
  wrong: { h: Etwas falsch?, p: "Unten auf jeder Termin- und Ortsseite steht „Stimmt etwas nicht?“. Tipp drauf und sag es uns." }
