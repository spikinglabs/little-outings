  translate: { h: 翻译和标签, p: "中文名称是机器翻译，德文原名写在下面，方便你对照海报和路牌。“需要会德语吗？”一开始是根据活动标题猜的，带“？”；家长点选以后，以多数人的回答为准。" }
  taps: { h: 你的点选, p: "设施、“去过”和“需要会德语吗？”这些点选会匿名计数，存在 Cloudflare 上。每个浏览器有一个随机编号，同一个问题只算一票，改选会覆盖之前的回答。IP 地址只保存加密后的哈希，用来防止刷票。" }
  writing: { h: 你写的内容, p: "小贴士、报错和推荐的新地点会先交给我们审核，审核通过后才会公开。请不要写姓名、电话等个人信息。" }
  profile: { h: 你的资料, p: "收藏、去过的地方和你的回答都保存在这部手机的浏览器里。没有账号，也不需要邮箱。你可以在“我的资料”里下载、转移到另一部手机或删除。如果你选择用通行密钥同步，服务器上会存一份同样的资料，删除资料时会一起删掉。" }
