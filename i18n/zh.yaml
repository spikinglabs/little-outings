about:
  link: 数据与隐私
  title: 数据与隐私
  intro: 小出游的信息从哪里来，你的反馈和资料存在哪里。
  events: { h: 活动, p: "活动来自城市、图书馆、博物馆和农场的公开活动日历。我们只用标题、日期、时间和地点这类事实，并附上原网页链接。时间和价格请以原网页为准。" }
