help:
  link: 帮助
  how: 使用说明
  title: 帮助
  intro: 简单说明小鹿出游怎么用：你的个人资料、你的网名、各种标记的含义，以及如何添加内容。
  profile:
    h: 个人资料是怎么回事
    p: 没有账号，不用邮箱，也没有密码。你的个人资料就是这部手机的浏览器记住的内容。
    phone: 在这部手机上
    phoneHas: 收藏、去过的地方、你的回答、所在城市、网名、你发来的内容
    optional: 可选：通行密钥同步
    passkey: 通行密钥里的副本
    passkeyHas: 安全保存在我们这里，并同步到你的其他设备。用面容、指纹或锁屏解锁。
    move: 转移
    moveHow: 用二维码或链接转到新手机
    download: 下载
    downloadHow: 所有内容存成一个文件，由你保管
    delete: 删除
    deleteHow: 先下载，再输入一句话确认
    b1: 不开同步的话，清除浏览器数据或丢了手机，个人资料就没了。记得偶尔下载一份，或者打开同步。
    b2: 开了通行密钥同步，第二部手机用通行密钥登录后，就会有同样的收藏和网名。
    b3: 删除会清除所有内容，包括我们这里的通行密钥副本。我们没有其他副本，所以无法撤销。
  nick:
    h: 你的网名
    p: 你发来的贴士、地点和活动会带一个随机起的网名，让其他家庭知道是同一位家长。第一次发送时我们会自动起一个；在个人资料里可以修改、换一个，或者清空保持匿名。请不要用真实姓名。
  marks:
    h: 标记是什么意思
    verified: 我们亲自核实过。
    official: 来自主办方或城市自己发布的信息。
    parents: 有家庭回答过相关问题（厕所、尿布台、价格……）。
    noneLabel: 没有标记
    none: 从公开信息或 OpenStreetMap 收集，尚未核实。出发前请向主办方确认。
  add:
    h: 添加活动或地点
    p: 在“添加”里，你可以通过海报、链接或手动输入发来活动，也可以推荐值得去的地方。所有内容上线前我们都会先看。之后可以在“我的”里修改你发来的内容。
  contact:
    h: 还有问题？
    p: 写信给我们，每封都会看：
about:
  link: 数据与隐私
  title: 数据与隐私
  intro: 小鹿出游的信息从哪里来，你的反馈和资料存在哪里。
  events: { h: 活动, p: "活动来自城市、图书馆、博物馆和农场的公开活动日历。我们只用标题、日期、时间和地点这类事实，并附上原网页链接。时间和价格请以原网页为准。" }
  places: { h: 地点, p: "游乐场、泳池、博物馆和农场等地点来自 OpenStreetMap（© OpenStreetMap 贡献者，ODbL 许可），每周更新一次。有家长补充过的地点，会显示家长反馈的数量。" }
  translate: { h: 翻译和标签, p: "中文名称和英文活动标题是机器翻译，德文原名写在下面，方便你对照海报和路牌。“需要会德语吗？”一开始是根据活动标题猜的，带“？”；家长点选以后，以多数人的回答为准。" }
  taps: { h: 你的点选, p: "设施、“去过”和“需要会德语吗？”这些点选会匿名计数，存在 Cloudflare 上。每个浏览器有一个随机编号，同一个问题只算一票，改选会覆盖之前的回答。IP 地址只保存加密后的哈希，用来防止刷票。" }
  writing: { h: 你写的内容, p: "小贴士、报错和推荐的新地点会先交给我们审核，审核通过后才会公开。“尚缺信息”的回答（开放时间、时间、价格）在两位家长回答一致或经我们核实后上线。请不要写姓名、电话等个人信息。你可以用一个自编的网名署名，网名会显示在旁边；请不要使用真实姓名。如需删除，请联系我们。" }
  ai: { h: 在你的 AI 助手里使用, p: "让 Claude、ChatGPT 或其他助手直接从小鹿出游找点子：把 {url} 添加为自定义连接器（Claude：设置 → 连接器；ChatGPT：设置 → 应用，开发者模式）。无需登录。之后助手可以搜索活动和地点，也能替你发送小贴士或新活动，和其他内容一样会先经我们审核。部分助手的自定义连接器需要付费订阅。" }
  profile: { h: 你的资料, p: "收藏、去过的地方和你的回答都保存在这部手机的浏览器里。没有账号，也不需要邮箱。你可以在“我的”下的“资料与同步”里下载、转移到另一部手机或删除。如果你选择用通行密钥同步，服务器上会存一份同样的资料，删除资料时会一起删掉。" }
  location: { h: 你的位置, p: "“附近”旁边有一个小小的定位按钮。只有你点了它，手机才会询问是否分享大致位置，用来选出最近的城镇。位置只留在你的手机上，绝不会发给我们；选出的城镇和你自己选的城镇一样保存。之后地图会用蓝点显示你的位置，直到你关闭页面或自己选择城镇。不用定位时，“附近”默认从科隆开始。" }
  stats: { h: 访问统计, p: "我们用 Cloudflare Web Analytics 统计页面浏览量，它不用 Cookie，也分辨不出不同访客。另外，我们只按每日总数统计少数点按，比如收藏或打开路线。两者都不知道你是谁。" }
  none: { h: 我们不做的事, p: "没有广告，没有 Cookie，没有跨网站追踪，不卖数据，不收集姓名和邮箱。" }
  wrong: { h: 信息不对？, p: "每个活动和地点页面下面都有“信息有误？”，点一下告诉我们。" }
  who: { h: 谁在做, p: "小鹿出游是 Spiking Labs 的产品。Spiking Labs 还做其他日常生活用的应用，都可以在 Spiking Labs 网站上看到。" }
