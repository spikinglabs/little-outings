  sent: { h: 你发给我们的内容, p: "提示、问题报告以及推荐的活动或地点会作为条目保存在一个私有 GitHub 仓库中（GitHub, Inc.，美国；欧美数据隐私框架），供我们审核。审核通过的文字发布时不带你的名字。请不要填写个人信息。法律依据：GDPR 第 6 条第 1 款 f 项。" }
  parse: { h: 识别海报和链接, p: "如果你用照片、链接或粘贴的文字添加活动，这些内容会一次性发送给 AI 服务（Google Gemini 或 Anthropic Claude，均在美国，欧美数据隐私框架），由它帮你填写表单。照片不会被保存。法律依据：GDPR 第 6 条第 1 款 b 项，因为这是你主动要求的。" }
  sync: { h: 通行密钥同步和邀请, p: "如果你开启通行密钥同步或创建邀请，我们会把你的资料或邀请以及通行密钥的公钥保存在 Cloudflare D1 中。不含姓名和邮箱。删除个人资料时，这些也会一并删除。法律依据：GDPR 第 6 条第 1 款 b 项。" }
  map: { h: 地图, p: "地图图块来自 OpenStreetMap（OpenStreetMap 基金会，英国，适用欧盟充分性认定），它会为传送图块而收到你的 IP 地址。法律依据：GDPR 第 6 条第 1 款 f 项。只有你点按定位按钮时，手机才会使用你的位置，位置信息不会发送给我们。" }
  fonts: { h: 字体, p: "所有字体均由本网站自身提供，不会有字体服务收到你的数据。" }
  rights: { h: 你的权利, p: "你有权查阅、更正、删除数据，限制处理，携带数据，以及反对基于正当利益的处理（GDPR 第 15–21 条）。大部分操作你可以在“我的” › “资料与同步”中自行完成；否则请给我们发邮件。你也可以向数据保护监管机构投诉。" }
