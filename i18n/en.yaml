about:
  link: Data and privacy
  title: Data and privacy
  intro: Where Little Outings gets its information, and where your answers and profile are kept.
  events: { h: Events, p: "Events come from the public calendars of cities, libraries, museums and farms. We use only facts such as title, date, time and place, with a link to the original page. Check times and prices there." }
  places: { h: Places, p: "Playgrounds, pools, museums, farms and other places come from OpenStreetMap (© OpenStreetMap contributors, ODbL), refreshed weekly. Once parents add to a place, it shows how many answers they gave." }
  translate: { h: Translations and labels, p: "Chinese names are machine-translated, with the German name underneath so you can match posters and signs. “Do you need German?” starts as a guess from the title, marked with “?”. Once parents tap an answer, the most common answer wins." }
  taps: { h: Your taps, p: "Taps on facilities, “We went” and “Do you need German?” are counted anonymously on Cloudflare. Each browser has a random id, so one question counts once and changing your answer replaces the old one. IP addresses are kept only as a hash, to stop vote flooding." }
  writing: { h: What you write, p: "Tips, reports and suggested places go to us for review first and only appear once approved. An answer to “Still missing” (opening hours, time, price) goes live once two parents give the same answer, or once we've checked it. Please don't include names, phone numbers or other personal details." }
  profile: { h: Your profile, p: "Your saved list, the places you went and your answers stay in this phone's browser. There is no account and no email. Under “Mine”, then “Profile and sync”, you can download it, move it to another phone or delete it. If you choose passkey sync, the server keeps one copy, which is deleted with your profile." }
  location: { h: Your location, p: "Next to “Around” there is a small location button. Only if you tap it does your phone ask to share its rough location, to pick the nearest town. The location stays on your phone and is never sent to us; the town is kept like a town you pick yourself. The map then shows a blue dot where you are, until you close the tab or pick a town yourself. Without it, “Around” starts at Cologne." }
  stats: { h: Counting visits, p: "We count page views with Cloudflare Web Analytics, which uses no cookies and can't tell one visitor from another. We also count a few taps, like saving or opening directions, as daily totals only. Neither knows who you are." }
  none: { h: What we don't do, p: "No ads, no cookies, no tracking across sites, no selling data, no names or emails." }
  wrong: { h: Something wrong?, p: "Every event and place page has “Something wrong?” at the bottom. Tap it and tell us." }
  who: { h: Who makes this, p: "Little Outings is a product by Spiking Labs, which also makes other apps for everyday life. You can see them all on the Spiking Labs website." }
