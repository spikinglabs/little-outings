legal:
  link: Imprint and privacy
  title: Imprint and privacy notice
  german: "The German version of this page is the binding one."
  imprint: Imprint
  email: Email
  content: "Responsible for the content under § 18 (2) MStV: the person named above."
  privacy: Privacy notice
  controller: { h: Who is responsible, p: "The controller under the GDPR for this website is:" }
  hosting: { h: Hosting, p: "The site runs on Cloudflare Pages (Cloudflare, Inc., USA; certified under the EU-US Data Privacy Framework, with a data processing agreement). To deliver pages, Cloudflare necessarily processes your IP address and technical request data and keeps short-lived security logs. Legal basis: Art. 6 (1) (f) GDPR, our interest in a secure, working website." }
  stats: { h: Usage statistics, p: "We use Cloudflare Web Analytics to count page views, referring sites, countries, device types and loading speed. It sets no cookies, stores nothing on your device and does not recognise returning visitors; we only see totals. We also count a few actions (saving, opening directions, adding to the calendar, opening a website, sharing the list, installing the app) as daily totals by language, with no IP address and no id. Legal basis: Art. 6 (1) (f) GDPR, our interest in knowing which parts of the site are used." }
  device: { h: Stored on your device, p: "Your saved list, the town you picked, your answers, a random browser id and your settings are kept in your browser's local storage, only because you use those functions (§ 25 (2) no. 2 TDDDG). We do not use cookies. You can delete everything under Mine › Profile and sync, or by clearing the site data in your browser." }
  taps: { h: Taps and votes, p: "Taps on facilities, “We went” and “Do you need German?” are stored in a Cloudflare D1 database together with a hash of your random browser id and a hash of your IP address, which we use only to stop vote flooding. They stay until you delete your profile. Legal basis: Art. 6 (1) (f) GDPR." }
  sent: { h: What you send us, p: "Tips, reports and suggested events or places are stored as entries in a private GitHub repository (GitHub, Inc., USA; EU-US Data Privacy Framework) so we can review them. Approved text is published without your name. Please don't include personal details. Legal basis: Art. 6 (1) (f) GDPR." }
  parse: { h: Reading posters and links, p: "If you add an event from a photo, link or pasted text, that content is sent once to an AI service (Google Gemini or Anthropic Claude, both USA, EU-US Data Privacy Framework) to fill in the form for you. The photo is not stored. Legal basis: Art. 6 (1) (b) GDPR, because you asked for it." }
  sync: { h: Passkey sync and invites, p: "If you turn on passkey sync or make an invite, we store your profile or invite and your passkey's public key in Cloudflare D1. There is no name or email. Deleting your profile deletes them. Legal basis: Art. 6 (1) (b) GDPR." }
  map: { h: Map, p: "Map tiles load from OpenStreetMap (OpenStreetMap Foundation, United Kingdom, covered by an EU adequacy decision), which receives your IP address to send the tiles. Legal basis: Art. 6 (1) (f) GDPR. Your location is only used on your phone if you tap the locate button, and is never sent to us." }
  fonts: { h: Fonts, p: "All fonts are served from our own site. No font service receives your data." }
  rights: { h: Your rights, p: "You have the right to access, correction, deletion, restriction of processing, data portability and to object to processing based on legitimate interests (Art. 15–21 GDPR). Most of this you can do yourself under Mine › Profile and sync; otherwise email us. You can also complain to a data protection supervisory authority." }
