# A Rednote (小红书) explainer: car child safety locks (汽车童锁): why they matter, the kinds, the first patent,
# and a question that invites parents' own stories. No car brand named anywhere (L: 我们不涉及品牌), so the
# carmaker said to be first to fit rear child locks is left out on purpose.
# History (find a post by its code: grep -l "code: KS4D" posts/):
# - 2026-11-23 L: "做一期跟汽车童锁有关的小红书帖子，讲一下重要性，种类，发明人，历史等等", "信息要准确",
#   "后面要吸引大家评论，让大家有什么故事，讨论自己家的车". Written with these sources:
#   - Patent US 2,629,246 "Safety door latch", Joseph M. Schumann, Inglewood, Calif.; filed 1949-03-07, granted
#     1953-02-24: https://patents.google.com/patent/US2629246A/en . Its text: "a child alone in the rear seat can
#     readily raise the button and then unlatch the door while the vehicle is in motion." (Wikipedia's
#     "patented 7 June 1949" does not match the patent, so the post gives the patent's own dates.)
#     Said "最早的童锁专利之一", not "the first": no source proves nothing came earlier.
#   - UN ECE Regulation No. 11, para 2.7 (German text, umwelt-online.de): Kindersicherung = a lock engaged and
#     released on its own that stops the inner door handle from working.
#   - ADAC "Elektrischer Fensterheber: Gefahr für Kinder" (2019-04-26): closing force up to 300 N, up to 30 kg on
#     a child's hand or head; Kinderschutz-Schalter at the driver's door for the rear windows; Einklemmschutz;
#     tennis ball test; don't leave children alone in the car, take the key.
#   - Door lock and rear window lock are separate settings in some cars (owners' manuals; no brand named).
#   - Central locking vs child lock: owners' manuals and German car sites say a locked door often opens by pulling
#     the inside handle (rear doors: some need two pulls); said "很多车上", not every car.
#   Left out as unconfirmed: which year carmakers first fitted rear child locks, and whether EU law requires them.
# - 2026-11-23 L: "说一下不同锁的区别和真正的童锁是什么，并且解释并不是所有的车都有电子童锁": added the
#   real child lock (UN R11), not every car has an electric one, central lock and window lock compared, 4-lock table.
# - 2026-11-23 L: "有点逻辑混乱" (circled card 2): card 2 now only about doors; window force moved to the window lock card.
code: KS4D
label: 汽车童锁 · 种类 发明 小故事
title: 后门从里面打不开？那是童锁
caption: |
  坐后排拉门把手，门却打不开？多半是童锁开着。这个小开关，是为了防止孩子在车里自己开门🚗

  ① 为什么重要：孩子好奇，看到门把手就想拉。车开着时开门，或停车后自己下车，都很危险。童锁就是为这件事设计的。
  ② 真正的童锁：一个单独开关的锁，锁上后，后门在车里的门把手不起作用，只能从车外开（联合国 UN R11 车门锁法规里的定义）。
  ③ 两种开法：机械童锁在后门侧边，关上门就看不到，用钥匙或拨片切换，左右门分别设；电子童锁是驾驶座车门上的按键或车机菜单。作用一样。
  ④ 不是每辆车都有电子童锁：很多车只有门边的机械童锁。驾驶座有车窗锁按键，不代表有电子童锁，不确定就看车主手册。
  ⑤ 容易混：中控锁是一起锁门，很多车锁着时从里面拉门把手也能开（有的要拉两下），拦不住孩子；车窗锁只锁后排车窗开关，门照样能开；车窗关闭力最高约 300 牛顿，夹到小手相当于约 30 公斤（ADAC），所以窗锁也要开。
  ⑥ 发明：1949-03-07，美国加州 Inglewood 的 Joseph M. Schumann 申请了“安全车门锁”专利，1953 年获批（US 2,629,246），是最早的童锁专利之一。专利里写的就是：孩子独自坐后排，车开着时也可能自己打开车门。

  小提醒：孩子上车前看一眼童锁；不要把孩子单独留在车里，下车拔走钥匙（ADAC）。防夹功能可以用网球测试，别用手。

  💬 你有没有被童锁“关”在后排过？你家车的童锁是哪种？评论区说说你的小故事。
