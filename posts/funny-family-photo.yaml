title: "想给娃拍张好照片，太难了"
caption: |
  想给娃拍张好照片：拍了三百张，能用的一张，还是糊的😂

  ✌️ “笑一个！”比了剪刀手，闭着眼睛
  🙈 相册里都是鬼脸和后脑勺
  🐕 全家福：娃在哭、爸爸闭眼、妈妈在擦脸、狗跑进来
  🍦 最好的那张：娃吃冰淇淋吃得满脸都是，所有人都在笑

  最好的照片不用摆拍，抓到真实的一秒就够了📸

  晒一晒你家最搞笑的照片？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
