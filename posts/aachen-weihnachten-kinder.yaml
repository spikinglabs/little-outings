code: U4SH
title: 亚琛圣诞带娃活动｜2026
until: 2026-12-20
caption: |
  亚琛今年圣诞季的木偶剧、博物馆手工和童话歌剧，按主办方节目单挑了6个🎄

  A Die Kleine Theaterfabrik 木偶剧：12-12、12-13 15点。Puppenspiel Wintermärchen，冬天的童话。
  B Die Kleine Theaterfabrik 人偶剧：12-20（周日）15点。Ein total verhextes Weihnachtsfest，被施了魔法的圣诞节。
  C Eurogress 童话歌剧：12-20（周日）18点。Theater Aachen 圣诞音乐会：《糖果屋》Hänsel und Gretel。
  D Suermondt-Ludwig-Museum：11-29、12-06、12-13、12-20 下午14点。家庭降临节手工：圣诞树挂饰、贺卡等。
  E Centre Charlemagne 杖偶工作坊：12-05（周六）15–17点。圣诞市场旁边，做杖头木偶。
  F Centre Charlemagne 宝箱工作坊：12-12（周六）15–17点。做自己的小宝箱。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选亚琛。

  🗳 你家最想去哪个？评论区留字母（A–F）。
