caption: |
  带娃坐火车：大人担心晚点，娃最开心🚆

  🎉 火车晚点了，娃：“太好了，可以多看一会儿火车！”
  🍪 前二十分钟吃完了带的所有零食
  🐄 数窗外的牛：“第一百零七头！”
  😴 下车前五分钟睡着了

  大人在看时刻表，娃在看全世界🚂

  你家娃坐火车有什么趣事？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
