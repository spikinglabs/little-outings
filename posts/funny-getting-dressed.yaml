title: "早上给娃穿衣服，要一小时"
caption: |
  早上给娃穿衣服，八点出门，七点就得开始😂

  🩳 零度要穿短裤，下雨要穿公主裙
  🧦 袜子线硌脚，最后穿了两只不一样的
  👟 鞋子左右反了，“这样跑得快”
  🧤 终于出门，手套忘在家里了

  Kita 老师说：很有个性👍

  你家娃早上穿衣服要多久？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
