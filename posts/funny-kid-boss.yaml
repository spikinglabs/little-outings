  家里来了一位小老板：工资不发，要求很多，还不能辞职😂

  🎬 “你当大灰狼，爸爸当小猪，我当导演。”
  🐺 绩效考核：演大灰狼不够凶，重来
  ⭐ 员工福利：一个贴纸，贴在额头上
  😴 说好八点下班，八点半老板在沙发上睡着了

  老板睡着前说：“你们是最好的员工。”值了❤️

