code: S3HN
title: 圣诞市场带娃吃什么
until: 2026-12-23
caption: |
  第一次带娃逛德国圣诞市场，不知道点什么？孩子能吃能喝的整理好了🍭

  🧃 Kinderpunsch：热的果汁饮料，不含酒精。和大人的 Glühwein（热红酒）长得很像，点的时候说清楚。
  🥜 Gebrannte Mandeln：糖炒杏仁，现炒的整条街都香。
  🥔 Reibekuchen：炸土豆饼，配苹果泥（Apfelmus）。
  🌰 Heiße Maronen：烤栗子。
  🥞 Crêpes：可丽饼，巧克力或糖粉。
  🍓 Schokofrüchte：巧克力裹的水果串。
  ❤️ Lebkuchenherz：姜饼心，上面写字，多数是挂着当纪念的。

  小提示：热饮装在杯子里要付杯子押金（Pfand），还杯子退钱，也可以把杯子带回家做纪念。
  小宝宝注意整颗坚果和硬糖，容易呛到。

  🗳 你家孩子最爱哪个？评论区留字母（A–F）。
