# A Rednote (小红书) explainer: how German families spend Christmas (Heiligabend, Krippenspiel, Bescherung,
# Christkind vs Weihnachtsmann, the two holidays, the tree until 6 January). General customs; 2026 weekdays from
# the calendar (24 Dec is a Thursday).
# History (find a post by its code: grep -l "code: R8HT" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: R8HT
title: 德国人怎么过圣诞节
until: 2026-12-26
caption: |
  在德国，圣诞最重要的是 12-24 平安夜（Heiligabend），不是 12-25🎄 第一次在德国过圣诞的家庭可以看看：

  ① 12-24（今年周四）：下午很多教堂有孩子演的 Krippenspiel（耶稣诞生的小剧），晚上全家吃饭、拆礼物（Bescherung）。
  ② 礼物是谁送的？南部和西部很多家庭说是 Christkind（圣婴），北部和东部多说 Weihnachtsmann（圣诞老人）。
  ③ 12-25、12-26 两天都是法定假日，走亲戚、吃大餐。
  ④ 圣诞树常常在 12-24 前几天才装饰，一直放到 01-06 前后。
  ⑤ 这几天商店都关门，提前买好吃的。

  🗳 你家圣诞最期待哪一刻？评论区留字母（A–F）。
