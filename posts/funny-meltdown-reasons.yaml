label: 搞笑 带娃 · 娃崩溃的离谱理由
title: 娃崩溃的理由，一个比一个离谱
caption: |
  当了爸妈才知道，眼泪可以来得这么快😂 以下全部来自真实带娃现场👇

  🍌 香蕉断了。他要一根完整的香蕉。
  🥤 给了蓝色杯子。他昨天最喜欢蓝色，今天不是了。
  🛗 帮他按了电梯按钮。
  🌧️ 雨停了，没法踩水坑了。
  🌙 月亮刚才跟着车走，现在不见了。
  🍪 最离谱：要我们把吃掉的饼干"变回去"。

  我们做不到。他哭了二十分钟，然后高高兴兴吃了另一块饼干。

  你家娃最离谱的崩溃理由是什么？评论区比一比～
  周末想带娃出门换换心情：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
