title: 法兰圣诞儿童活动｜2026
until: 2026-12-31
caption: |
  法兰克福圣诞市场之外，今年圣诞季还有这些儿童活动，按主办方节目单挑了6个🎄

  A Galli Theater 童话剧：11-29 到 01-03 每周日 11点。Märchenkarussell，童话旋转木马。
  B Zoo Frankfurt 降临节手工：12-06（周日）10点。Adventsbasteln。
  C Städel Museum：12-06（周日）11点。Märchenreise，在美术馆里听童话。
  D Junges Museum 假期工作坊：12-22、12-29、01-05、01-07 14:30。Offene Werkstatt，放假时的开放手工坊。
  E Zoo Frankfurt：12-24（周四）11点。Warten aufs Christkind，平安夜上午等圣诞。
  F Galli Theater 儿童跨年：12-31（周四）12点。Kinder-Silvester-Party，中午就跨年。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选法兰克福。

  🗳 你家最想去哪个？评论区留字母（A–F）。
