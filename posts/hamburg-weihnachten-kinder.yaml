code: K9WA
title: 汉堡圣诞带娃活动｜2026
until: 2027-01-01
caption: |
  汉堡今年圣诞季的儿童剧、博物馆和图书馆活动，按主办方节目单挑了6个🎄 圣诞市场在之前那篇。

  A Planetarium Hamburg：12-19（周六）14点。Weihnachten unterm Sternenzelt，星空下的圣诞。
  B Hamburger Puppentheater 木偶剧：12-05 到 12-10 11点。Weihnachtsfest mitohne Gans，在 Barmbek。
  C Altonaer Museum 冬日周末：12-05、12-06 10–18点。Winterliches Wochenende。
  D Bücherhalle Kirchdorf 儿童剧：12-05（周六）16点。Oberwichtel dringend gesucht，找精灵头头。
  E Bücherhalle Altona：12-08（周二）15点。毛绒玩具在图书馆过夜，圣诞特别场。
  F Staatsoper 芭蕾：12-27（周日）、01-01 14点。《胡桃夹子》下午场。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选汉堡。

  🗳 你家最想去哪个？评论区留字母（A–F）。
