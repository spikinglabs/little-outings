# A Rednote (小红书) explainer: dressing children for the German winter. Common Kita and safety advice: layers
# (Zwiebelprinzip), waterproof Matschhose, snowsuit for snow, tube scarf instead of a long scarf, no thick jacket
# under car-seat straps (safety advice from car clubs and paediatricians), spare clothes at the Kita, feel the neck
# to judge warmth. No brands.
# History (find a post by its code: grep -l "code: E8PQ" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: E8PQ
title: 德国冬天给娃怎么穿
until: 2027-02-28
caption: |
  德国冬天又湿又冷，幼儿园每天都要出去玩🧤 给娃穿衣服，德国家长常说这几条：

  ① 洋葱式穿法（Zwiebelprinzip）：几层薄的比一件厚的好，热了能脱。
  ② 防水裤（Matschhose）：下雨天踩水坑必备，很多幼儿园要求放一条。
  ③ 下雪天穿连体雪服（Schneeanzug）。
  ④ 帽子、手套，围巾换成套头围脖（Schlauchschal），玩的时候不容易被挂住。
  ⑤ 坐儿童座椅时别穿厚羽绒服：安全带会离身体太远，上车脱外套，盖毯子。
  ⑥ 幼儿园放一套备用衣服（Wechselkleidung）。
  ⑦ 冷不冷摸后颈：后颈暖、不出汗就刚好。

  🗳 你觉得哪件最必备？评论区留字母（A–F）。
