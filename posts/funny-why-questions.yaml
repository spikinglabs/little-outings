code: JRUG
label: 搞笑 带娃 · 为什么连环问
title: "娃的十万个为什么，接不住了"
caption: |
  娃一天能问多少个为什么？我们数过，大概 300 个😂

  🥛 为什么牛奶是白的，牛是黑白的？
  🚦 为什么要等红灯？为什么危险？为什么车很快？为什么你不说话了？
  🐟 小鱼会不会想妈妈？
  😴 为什么我睡觉的时候，你们就不累了？

  累是真的累，但每个问题都是她在认识这个世界❤️

  你家娃最难回答的问题？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
