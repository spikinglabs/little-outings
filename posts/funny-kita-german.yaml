code: M8RT
label: 搞笑 带娃 · 娃上德国Kita以后
title: 娃上了德国Kita以后…
caption: |
  娃上了德国 Kita 三个月，家里多了一位德语老师，和一位规矩督察😂

  🗣️ 开始纠正我们的发音："是 Eichhörnchen！"
  🧦 中文说一半，德语补一半："我要穿那个 Matschhose！"
  👋 跟每个人说 Tschüss，包括邻居家的狗。
  ♻️ 瓶子、盖子、纸盒，他分得比我们清楚。
  🚦 红灯时整条街没车，他也坚决不走（这个请继续保持）。
  🌧️ 下雨不想出门？"没有坏天气，只有不合适的衣服！"

  娃的融入速度：三个月。我们的融入速度：还在努力中💪

  你家娃从 Kita 学回来什么？评论区聊聊～
  想找身边的亲子活动：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
