# A funny parenting (搞笑带娃) post kept in stock, no date: weekend outing plans vs what really happens. Both
# parents are "we"; the joke is on plans meeting a toddler's pace (L, 2026-11-21: no group offended, respect women).
# Find these in the admin by typing 搞笑 (every one of them has "搞笑 带娃" in its label).
code: V3BN
label: 搞笑 带娃 · 出门计划vs现实
title: 带娃出门：计划vs现实
caption: |
  每个周末都信心满满，每个周末都被现实教育😂

  ⏰ 计划 10:00 出发，现实 11:47 出发
  🎒 计划带一个包，现实带了三个包和一辆滑板车
  🚧 计划路上 20 分钟，现实看挖掘机 15 分钟、看蜗牛 10 分钟
  🦖 计划去博物馆看恐龙，现实在门口的水坑玩了一小时
  🦁 计划去动物园看狮子，现实最喜欢的是动物园里的鸽子
  🚗 计划回家路上睡着，现实到家门口才睡着，一下车就醒

  然后他说：今天真好玩，明天还去！❤️

  你家周末计划最大的翻车是什么？评论区聊聊～
  下个周末去哪：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
tags: [带娃日常, 周末遛娃, 遛娃, 搞笑, 萌娃, 德国带娃, 亲子, 留德]
