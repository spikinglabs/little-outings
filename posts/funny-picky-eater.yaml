label: 搞笑 带娃 · 吃饭斗智斗勇
title: "跟娃吃饭，是一场谈判"
caption: |
  每顿饭都是一场外交谈判，我们很少赢😂

  🥦 不要绿色的东西，米饭和菜不能碰在一起
  🤝 说好吃五口，成交价三口，实际一口半
  🏫 家里的西兰花不吃，Kita 的西兰花吃了两份
  🍦 刚说吃饱了，看到冰淇淋突然有了甜品胃

  不过只要他开心地吃了一口新东西，我们就算赢❤️

  你家娃有什么吃饭怪规矩？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
