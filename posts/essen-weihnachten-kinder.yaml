code: P2NG
title: 埃森圣诞带娃去哪｜2026
until: 2026-12-30
caption: |
  埃森今年圣诞季的溜冰、演出和博物馆活动，按主办方节目单挑了6个🎄

  A Zollverein 溜冰场：12-05 起。在老焦化厂旁边溜冰；工作日15点起，周末10点起。
  B Aalto-Theater 芭蕾：11-29 到 12-30 多场。《胡桃夹子》。
  C Bürgerhaus Oststadt：12-12（周六）16点。家庭剧场和音乐会 Weißt du, was Weihnachten ist?。
  D Philharmonie Essen：12-26（周六）14点。给孩子的《圣诞清唱剧》。
  E Ruhr Museum 导览：12-06（周日）12点。展览 überLeben in der Eiszeit，冰河时期。
  F Schloss Hugenpoet 尼古拉斯市场：12-03 到 12-06 16–22点。城堡里的小圣诞市场。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选埃森。

  🗳 你家最想去哪个？评论区留字母（A–F）。
