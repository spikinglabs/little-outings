# A Rednote (小红书) post from L's own kitchen (2026-11-18): the 4-in-1 steamer-blender's jar, if it goes into the
# dishwasher without a rinse first, ends up with food bits washed into its sealed bottom, which is hard to open.
# The photo is L's (posts/photos/food-maker-bottom.jpg, cropped, residue ringed in our yellow).
# The fix is the brand's own support page ("Food is stuck on the inside of my ... baby food maker",
# philips.co.uk/c-t/XC000004699, read 2026-11-18): rinse every part under the tap before the dishwasher; to flush the
# jar, line up the hole in its bottom with the tap, rinse with warm water, shake 15 s, pour out, repeat.
# Brand named on purpose: L asked for this product by name (2026-11-18), unlike the no-brands rule for other posts.
# Ends on a public question about how people wash it (never about their kids).
# History (find a post by its code: grep -l "code: AV4B" posts/):
# - 2026-11-18 L: "做一个新的 post，就说 Philips avent 4 in 1 的一个潜在问题……可以用这个配图，但是做成我们的风格".
code: AV4B
title: 4合1辅食机杯底藏残渣？先冲再洗
until: 2027-06-30
caption: |
  家里用飞利浦新安怡 4合1 蒸煮辅食机的注意啦⚠️ 我们家这次图省事，用完直接放进洗碗机，结果杯子底部的夹层里被冲进了食物残渣（第1张图），这个底部又很难打开清理😭

  官方客服页上其实写了：
  ✅ 放洗碗机之前，所有零件先在水龙头下冲一遍
  ✅ 杯底有个小孔：拿下盖子和刀片，把小孔对准水龙头，用温水冲
  ✅ 摇15秒，把残渣连水倒掉，重复到冲干净
  ✅ 晾干再装回去

  🗳 你家辅食机怎么洗？评论区留字母：
  A 手洗
  B 先冲再进洗碗机
  C 直接进洗碗机
  D 没用过辅食机

  有没有其他清洗小技巧？欢迎分享～
