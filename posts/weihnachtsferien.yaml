code: WF7H
title: 德国圣诞假期几号放？6个州一览｜2026
until: 2026-12-23
caption: |
  德国各州圣诞假期时间不一样🎄 按文教部长联席会议（KMK）公布的假期表，整理了我们关注者最多的6个州（第一天到最后一天都是假期）👇

  北威（NRW）：12-23 到 01-06
  柏林：12-23 到 01-02
  巴伐利亚：12-24 到 01-08
  黑森：12-23 到 01-12
  汉堡：12-21 到 01-01
  巴符：12-23 到 01-09

  具体以学校通知为准，幼儿园的关门时间各园不同，记得问一下～

  🗳 今年圣诞假期你家怎么过？评论区留字母：
  A 回国 B 德国境内旅行 C 去别的欧洲国家 D 在家附近玩

  假期带娃去哪：浏览器搜索「小鹿出游 Allo Outings」，选城市就能看到。
