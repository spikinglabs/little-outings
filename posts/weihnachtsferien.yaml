# A Rednote (小红书) save-for-later post: Christmas school holidays 2026/27 in the states of the site's cities.
# Dates from data/school-holidays.json (openholidaysapi.org, the same data as the site's holidays button):
# NW 2026-12-23–2027-01-06, BE 12-23–01-02, BY 12-24–01-08, HE 12-23–01-12, HH 12-21–01-01. Plus the next short
# break where one comes before Easter: BE Winterferien 02-01–02-06, BY Frühjahrsferien 02-08–02-12.
# History (find a post by its code: grep -l "code: J2PA" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: J2PA
title: 2026圣诞假期各州日期
until: 2026-12-23
caption: |
  2026/27 圣诞学校假期（Weihnachtsferien），按州整理好了📅 先收藏，安排出行和托管：

  北威州（科隆、杜塞、波恩、埃森、亚琛）：12-23 – 01-06
  柏林：12-23 – 01-02
  巴伐利亚（慕尼黑）：12-24 – 01-08
  黑森（法兰克福）：12-23 – 01-12
  汉堡：12-21 – 01-01

  再往后：
  柏林冬假 02-01 – 02-06
  巴伐利亚 02-08 – 02-12 放一周

  日期写的是假期第一天和最后一天，个别学校会多放一两天，以学校通知为准。
  假期里的活动：浏览器搜索「小鹿出游 Allo Outings」，点「学校假期」。

  🗳 圣诞假期你家一般怎么过？评论区留字母（A–F）。
