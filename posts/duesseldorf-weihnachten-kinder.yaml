code: T5UX
title: 杜塞圣诞带娃活动｜2026
until: 2026-12-23
caption: |
  杜塞尔多夫今年圣诞季的儿童剧、亲子活动和假期工作坊，按主办方信息挑了6个🎄 圣诞市场在之前那篇。

  A Puppentheater Helmholtzstraße：12-03（周四）10:30。木偶剧 Charlotte und die Weihnachtsgans。
  B Gerresheim 纸芝居：12-02（周三）15点。Kamishibai 讲故事：圣诞精灵的许愿机。
  C Bunker Paulsmühle：12-05（周六）14点。Kinder-Nikolaus，儿童尼古拉斯活动。
  D Grafenberger Wald 亲子活动：12-12（周六）10点。森林里过圣诞，4岁以上，要报名。
  E Bürgerhaus Reisholz 儿童剧：12-16（周三）15点。Das Märchen vom Pfefferkuchenherz，姜饼心的童话。
  F K21 假期工作坊：12-23（周三）10–14点。8到10岁，艺术馆里画精灵和怪物，要报名。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选杜塞尔多夫。

  🗳 你家最想去哪个？评论区留字母（A–F）。
