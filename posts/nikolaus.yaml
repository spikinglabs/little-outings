# A Rednote (小红书) explainer: Nikolaustag (6 Dec), the boots put out the evening before, Nikolaus vs Weihnachtsmann,
# Knecht Ruprecht. Festival explainers do well (the St. Martin one got the most likes). Ends on a public vote.
# Sources (read 2026-11-25): planet-wissen.de/kultur/brauchtum/weihnachtsbraeuche/weihnachten-braeuche-feiertage-nikolaus-100.html
# and stuttgarter-zeitung.de Nikolaus explainers (boots out on the evening of 5 Dec, filled overnight with small gifts,
# sweets, nuts or fruit; some regions a plate; Nikolaus of Myra, a 4th-century bishop; Knecht Ruprecht as companion,
# with regional names such as Krampus; the Weihnachtsmann is a later figure). 2026-12-06 is a Sunday (2nd Advent).
# History (find a post by its code: grep -l "code: NK6D" posts/):
# - 2026-11-25 weekly topic post (Kunla AL-8): festival explainer, posted before 12-05.
code: NK6D
title: 12-06尼古拉斯节，德国娃为啥放靴子？
until: 2026-12-06
caption: |
  12-06 是德国的尼古拉斯节（Nikolaustag）🎅 前一天晚上，很多孩子会把靴子放在门口，第二天早上靴子里就有小礼物。第一次在德国过的家长，看这一篇就够了👇

  📅 今年 12-05 是周六，12-06 是周日，正好也是第二个降临周日
  👢 12-05 晚上把靴子放门口，有的地方放盘子
  🍫 早上靴子里是巧克力、坚果、橘子这类小东西
  🧔 尼古拉斯不是圣诞老人：他是一位主教，戴主教帽、拿权杖
  🎄 12-24 送大礼物的是圣诞老人（Weihnachtsmann）或圣婴（Christkind）

  🗳 你家靴子里放什么？评论区留字母：
  A 巧克力 B 坚果和橘子 C 小玩具 D 我们不过这个节

  你们那里的尼古拉斯还有什么讲究？欢迎分享～
