# A Rednote (小红书) explainer: the order and timing of baby teeth (乳牙萌出顺序和时间), the permanent teeth, and
# what the German statutory insurance covers at the dentist. Ends with a vote that invites parents' teething stories.
# History (find a post by its code: grep -l "code: YA6T" posts/):
# - 2026-11-23 L: "小孩子长牙的顺序和时间，要找到权威的信息再详细并且提供图片和动画的方式来解释". Written with:
#   - BIÖG (ex BZgA) kindergesundheit-info.de, Zahnentwicklung + Infografik "Die ersten Zähne" (2025-05-20):
#     first teeth mostly 6–8 months, lower then upper central incisors first; ranges 6–8 / 8–12 / 12–16 (first
#     molars) / 16–20 (canines) / 20–30 (second molars); all 20 at about 2.5 years; red gums, drooling, unrest,
#     slightly raised temperature; diarrhoea or high fever have other causes, see the paediatrician.
#   - AAPD Reference Manual "Dental Growth and Development" (Logan & Kronfeld 1933, adapted 2003), r_dentalgrowth26.pdf:
#     eruption maxillary/mandibular 6-10/5-8, 8-12/7-10, canines 16-20, first molars 11-18, second molars 20-30;
#     permanent order; "Many otherwise normal infants do not conform strictly to the stated schedule."
#   - ADA mouthhealthy.org eruption charts (images read): primary upper 8-12, 9-13, 16-22, 13-19, 25-33 mo; lower
#     6-10, 10-16, 17-23, 14-18, 23-31 mo; permanent upper 7-8, 8-9, 11-12, 10-11, 10-12, 6-7, 12-13, 17-21 y;
#     lower 6-7, 7-8, 9-10, 10-12, 11-12, 6-7, 11-13, 17-21 y. "start to come in at about 6 months".
#   - NHS "Baby teething symptoms" (reviewed 2026-05-14): ~6, ~8, ~12, ~18, ~24 months; some before 4 months, some
#     after 12, some born with teeth; bottom often before top; all by 2 to 3 years; temperature slightly raised but
#     under 38 °C; no evidence teething causes diarrhoea.
#   - AAP healthychildren.org "Teething: 4 to 7 Months" (2024-06-26): over 38.3 °C probably not teething; firm rubber
#     rings, frozen ones can do more harm; amber necklaces don't help and caused choking/strangulation; never numbing
#     gels; dentist within 6 months after the first tooth, no later than 12 months.
#   - KZBV "Gesunde Kinderzähne" + BIÖG Früherkennung: six check-ups Z1–Z6 from month 6 to 72 (Z1 6–9, Z2 10–20,
#     Z3 21–33 months), Fluoridlack; since January 2026 in the Gelbes Heft. (KZBV and BIÖG differ on how long the
#     Fluoridlack applies, so the post gives no end age.)
#   Pictures teeth-*.png drawn by hand (HTML + SVG, scratch script), sources printed on each.
# - 2026-11-23 L: "时间真的对么？…去搜索更多文献，检查一下". Re-checked against studies (PubMed):
#   - Zhang et al., Sci Rep 2024, doi 10.1038/s41598-024-59044-0 (China nine-city surveys, 88,875 children <2 y in
#     2015): first tooth median 6.6 mo, P3–P97 4.1–10.6 mo; median teeth 2 at 8–10 mo, 8 at 12–15 mo, 16 at 18–24 mo,
#     all 20 at about 28–32 mo. Matches BIÖG's group ranges.
#   - Dodo et al., Children 2023 (Japan JECS, parents' records): median lower central 7.1/7.6, upper central 8.7/9.2,
#     upper lateral 10.0/10.3, lower lateral 10.4/10.8 months (boys/girls); parents' dates earlier than check-ups.
#   - Woodroffe et al., Aust Dent J 2010: first 8.6, last 27.9 months; order central, lateral, first molar, canine,
#     second molar. Li et al. 2017 (Chongqing): first tooth 2–15 mo (median 8), lower incisor first in 95%.
#   - Muthu et al., Arch Oral Biol 2024 meta-analysis (42 studies): Europe earliest, Asia/South America later.
#   Changed: card 3 no longer says all lower teeth come first (upper laterals often precede lower); card 5 uses the
#   2015 China percentiles; caption ① and ④.
code: YA6T
label: 宝宝长牙顺序 · 乳牙 恒牙 牙医
title: 宝宝先长哪颗牙？长牙顺序一张图看懂
caption: |
  宝宝长牙先长哪颗、几个月长？我们对照了德国、美国、英国四个权威来源，画成了图🦷

  ① 顺序：下中切牙 → 上中切牙 → 侧切牙（常常上面先长）→ 第一乳磨牙 → 乳尖牙 → 第二乳磨牙。尖牙比第一乳磨牙晚，所以中间会先空一个位置。
  ② 月龄（德国 BIÖG）：中切牙 6–8 个月，侧切牙 8–12 个月，第一乳磨牙 12–16 个月，乳尖牙 16–20 个月，第二乳磨牙 20–30 个月。约 2 岁半 20 颗乳牙长齐（NHS：2 到 3 岁）。
  ③ 来源之间的差别：美国儿童牙科学会 AAPD 下中切牙 5–8 个月；美国牙医协会 ADA 下中切牙 6–10 个月、上中切牙 8–12 个月，第二乳磨牙到 33 个月。顺序一致，月份能差几个月。
  ④ 早晚都常见：中国 2015 年九城市调查（约 9 万名 2 岁以下儿童）第一颗牙中位数 6.6 个月，97% 的宝宝在 4.1–10.6 个月之间；12–15 个月一般 8 颗左右。NHS：有的 4 个月前，有的 1 岁以后，少数出生就有牙。日本一项大型出生队列发现，父母自己记录的出牙时间比体检时查到的早。AAPD：很多完全正常的宝宝不严格按表长。
  ⑤ 长牙时：牙龈红、口水多、爱咬东西、烦躁睡不好，体温可能略高。高烧或腹泻不是长牙引起的，要看儿科医生（BIÖG、NHS、美国儿科学会 AAP）。
  ⑥ 安抚：美国儿科学会建议用硬橡胶牙胶，冷冻的可能弊大于利；不用琥珀牙链（不止痛，发生过窒息和勒颈）；不用麻醉牙龈的凝胶。
  ⑦ 在德国看牙医：法定医保从 6 个月到 6 岁有 6 次儿童牙科早期检查（Z1–Z6）。Z1 在 6–9 个月，Z2 10–20 个月，Z3 21–33 个月，检查时可涂氟保护漆。2026 年起记在黄本里（KZBV）。美国儿科学会：第一颗牙后 6 个月内、最晚 1 岁看牙医。
  ⑧ 换牙：6–7 岁长出第一恒磨牙（六龄齿），它长在乳牙后面，不换掉任何乳牙；门牙 6–8 岁开始换，最后是第二恒磨牙 11–13 岁（ADA）。

  每个宝宝不一样，担心长得早或晚，就在检查时问问牙医。

  💬 你家宝宝的第一颗牙是几个月长的？先冒出来的是上面还是下面？评论区说说你家的长牙小故事。
