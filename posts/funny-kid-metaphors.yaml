title: "娃的比喻，比作家还厉害"
caption: |
  小孩的脑子里住着一位诗人✨ 收集了一些我们家娃的神比喻👇

  ⛈️ 打雷：天上的人在搬家具
  🦶 脚麻了：我的脚里有好多小汽水
  🐸 打嗝：我肚子里有只小青蛙
  🔋 “我现在电量很低，需要充电。”说完就睡着了

  建议准备一个小本子记下来，等她长大了念给她听📒

  你家娃说过什么神比喻？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
