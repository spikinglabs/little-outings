caption: |
  娃洗澡：进去难，出来更难，中间只隔二十分钟😂

  🐱 “我是一只小猫，小猫不洗澡。”
  🦆 带了十二个玩具进浴缸，地上的水比浴缸里还多
  🐟 “我是一条鱼，鱼不能离开水。”
  🏃 出来后光着身子在家里跑了三圈

  两个大人一个拖地一个吹头发，配合默契💪

  你家娃用过什么理由不洗澡？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
