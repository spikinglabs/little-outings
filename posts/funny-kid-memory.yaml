caption: |
  娃的记忆力真的很神奇：该记的不记，不该记的全记得😂

  🙉 记不住：刚刚说过的“不可以”
  🍦 忘不了：三个月前答应的冰淇淋
  🎤 在 Kita 门口大声说：“妈妈昨天唱歌跑调了！”
  🐰 讲了一百遍的绘本，跳一页都不行

  说话前请三思，你随口答应的每一件事，他都记住了😅

  你家娃记得最清楚的是什么？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
