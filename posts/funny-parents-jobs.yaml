label: 搞笑 带娃 · 娃眼中爸妈的工作
title: "娃眼中，爸妈是做什么的"
caption: |
  Kita 老师问：你爸爸妈妈做什么工作？娃的回答👇😂

  💻 “妈妈的工作是看电脑，然后叹气。”
  💪 “妈妈修好了公司的一个大问题。”
  📞 “爸爸的工作是打电话，说‘好的好的’。”
  🥟 “爸爸会做很好吃的饺子，这也是工作。”

  长大了想“像妈妈一样修大问题，像爸爸一样做饺子”❤️

  你家娃怎么形容你的工作？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
