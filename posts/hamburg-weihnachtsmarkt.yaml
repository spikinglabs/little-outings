  - tone: paper
    tag: A Rathausmarkt
    title: 会飞的圣诞老人
    lines:
      - 每天16、18、20点，圣诞老人坐着驯鹿雪橇从市场上空"飞过"，边飞边讲驯鹿鲁道夫的故事。
      - 还有老式旋转木马。每天11–21点。
      - 附近的 Mönckebergstraße：4个将临期周六（11-28、12-05、12-12、12-19）14点和17点有圣诞游行。
  - tone: paper
    tag: B Jungfernstieg
    title: 老摩天轮和童话船
    lines:
      - 1899年的老摩天轮，可以俯瞰市场和 Binnenalster。
      - 河边停着童话船（11-26到12-23）。
      - 12-06 16:30 尼古拉斯来，会背诗或唱歌的孩子能拿到糖。
  - tone: paper
    tag: C Harburg
    title: 霍勒大妈撒"雪花"
    lines:
      - 旋转木马、手工，还有讲童话的 Hans 爷爷。
      - 12-05 14点：汉堡最大的姜饼屋。
      - 12-06 17点：霍勒大妈从 Rathaus 窗口抖被子，撒下"雪花"和巧克力金币。
      - 12-13 15点：木偶剧。
  - tone: paper
    tag: D Bergedorf · E Ottensen
    title: 长袜子皮皮和木偶剧
    lines:
      - D Bergedorf：长袜子皮皮的小屋有壁炉、玩具和手工，周末能自己烤饼干；还可以和圣诞老人合影。
      - E Ottensen：儿童旋转木马、木偶剧，每周日有木偶剧场，12-06 尼古拉斯来。
  - tone: paper
    tag: F Wandsbek
    title: 已经能溜冰了
    lines:
      - Wandsbeker Marktplatz，10-31已开，到1月1日。
      - 溜冰每场90分钟：14岁以下3欧，大人4欧，租鞋4欧。
      - 每周三12–18点是家庭日，溜冰和儿童旋转木马都减价。12-06 尼古拉斯来溜冰场送礼物。
  - tone: paper
    tag: 换尿布 · 小提示
    title: 宝宝要换尿布？
    lines:
      - Rathausmarkt 和 Jungfernstieg：附近的药妆店有换尿布台（约190米，周日不开）。
      - Wandsbek：旁边的商场有换尿布台（约130米）。
      - Harburg：Rathaus 附近约80米有换尿布台。
    note: 晚上人多推车难走，背带更轻松。
    foot: 换尿布台位置来自 © OpenStreetMap 贡献者
