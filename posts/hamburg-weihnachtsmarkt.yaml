# A Rednote (小红书) set: Hamburg's Christmas markets for families. Every date, hour, price and children's offer
# checked on the market's hamburg.de page on 2026-11-12; changing tables from OpenStreetMap (places/toilets.jsonl).
# Drawn and uploaded by .github/workflows/posts.yml on push; the admin's Posts panel opens it by its code.
# Ends on a vote so parents talk in the comments (public: ask for favourites and tips, never about their kids).
# The posting job cuts the Chinese font itself, so new characters need no font commit.
# History (find a post by its code: grep -l "code: H9WD" posts/):
# - 2026-11-12 L asked for Christmas market posters that start a discussion; facts checked on official 2026 pages ("注意信息的可靠性").
# - 2026-11-12 L: no brand names, so shops on the changing-table card are named by kind (pharmacy, shopping centre).
# - 2026-11-13 L: "德语地名不用翻译". Squares, streets, buildings and venues now keep their German names (towns keep 科隆/法兰克福 etc.).
code: H9WD
title: 汉堡圣诞市场带娃哪个最好？｜2026
until: 2026-12-30
caption: |
  汉堡的圣诞市场已经陆续开门了🎄 按官方信息挑了6个适合带娃的，看完来评论区投票（A–F）👇

  A 【11-23起】Rathausmarkt：圣诞老人每天16、18、20点坐雪橇从头顶"飞过"
  B 【11-18起】Jungfernstieg：1899年的老摩天轮，童话船
  C 【11-19起】Harburg：12-06 霍勒大妈从 Rathaus 窗口撒"雪花"和巧克力金币
  D 【11-20起】Bergedorf：长袜子皮皮的小屋，周末自己烤饼干
  E 【11-19起】Ottensen：旋转木马、木偶剧
  F 【已开】Wandsbek：溜冰场，周三家庭日减价

  小提示：11-22（周日，Totensonntag）好几个市场不开。12-06 尼古拉斯节，B、C、E、F 都有活动。

  🗳 你家投哪个？评论区留下字母就行。
  也想听听大家的经验：白天去还是晚上去？推车还是背带？有没有人少的私藏小市场？

  时间以官方为准，出发前请再确认～
  更多市场：浏览器搜索「小鹿出游 Allo Outings」，选汉堡，点「圣诞市场」。
