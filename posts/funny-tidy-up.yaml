title: "让娃收玩具的五个阶段"
caption: |
  让娃收拾玩具的五个阶段，你家到了第几个？😂

  🏁 阶段一：比赛！娃收了一块积木，然后开始玩它
  🎵 阶段二：唱了三遍收拾歌，娃跳了三遍舞
  🤝 阶段三：谈判，“那收一半，看一半”
  👷 阶段四：大人自己收，娃当监工

  阶段五：五分钟后，又全倒出来了。有好办法请教教我们🙏

  你家怎么让娃收玩具？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
