label: 搞笑 带娃 · 娃口袋里的宝藏
title: "洗衣服前，先掏娃的口袋"
caption: |
  洗衣服前一定要先掏娃的口袋，别问我们怎么知道的😂

  🌰 三颗栗子，一颗被咬过
  🧾 一张超市小票，“是我的地图”
  🪱 一条蚯蚓，还活着
  🔑 爸爸找了三天的车钥匙，妈妈找了一周的耳机

  最后我们给这些宝贝放了一个专门的盒子📦

  你在娃口袋里掏到过什么？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
