code: B6RY
title: 波恩圣诞带娃活动｜2026
until: 2027-01-03
caption: |
  波恩今年圣诞季的儿童剧、手工和马戏，按城市活动日历挑了6个🎄

  A Bonner Weihnachtscircus 圣诞马戏：12-17 到 01-03 每天。在 Pützchens Marktwiesen 的大帐篷，时间看官网。
  B Haus der Familie 黑光圣诞音乐剧：12-05（周六）17点。Schwarzlichttheater，暗场里发光的人偶。
  C Haus der Natur 降临节手工：12-13（周日）13:30。用木头边角料做圣诞小物，在 Waldau 森林边。
  D Frauenmuseum 童话下午：12-18（周五）16点。Knusperschloss im Märchenwald，童话森林里的糖果城堡。
  E Brotfabrik 儿童剧：12-20（周日）11点。Der kleine Weihnachtsmann，小圣诞老人的故事。
  F Altes Rathaus Oberkassel 儿童剧：01-03（周日）16点。Die Weihnachtsgans Auguste，圣诞鹅 Auguste。

  Bad Godesberg 的尼古拉斯市场和 Münsterplatz 的圣诞市场在网站「圣诞市场」里。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选波恩。

  🗳 你家最想去哪个？评论区留字母（A–F）。
