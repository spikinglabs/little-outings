# A Rednote (小红书) explainer: New Year's Eve with children in Germany. Fireworks rules from the Sprengstoffverordnung
# as explained by the IHKs and Verbraucherzentrale: category F2 sold only on the last three working days of the
# year (2026: Tue 29 – Thu 31 Dec) to adults, used 31 Dec – 1 Jan; F1 (sparklers, snaps) sold all year from age 12.
# Lead pouring (Bleigießen) banned since 2018 (EU REACH); wax or tin instead. Many cities announce no-firework
# zones each year: told to check, no zones named.
# History (find a post by its code: grep -l "code: Q5ZE" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: Q5ZE
title: 德国带娃跨年要知道这些
until: 2026-12-31
caption: |
  德国的跨年夜（Silvester）到处放烟花🎆 带娃过年前，这几件事先知道：

  ① 烟花只在 12-29 到 12-31 卖（今年是周二到周四），只卖给18岁以上；放的时间是 12-31 到 01-01。
  ② 仙女棒、摔炮这类小东西全年都能买，12岁以上可以买。
  ③ 很多城市市中心有禁放区，每年城市会公布，出门前查一下。
  ④ 烟花声很大，小宝宝可以戴儿童耳罩；不少家庭傍晚先给孩子“提前跨年”。
  ⑤ 01-01 早上路上有很多烟花残骸，别让孩子捡没炸的。

  传统小活动：以前的“熔铅占卜”（Bleigießen）2018年起禁用铅，现在用蜡（Wachsgießen）；孩子喝无酒精的 Kinderpunsch 一起倒数。

  🗳 你家跨年怎么过？评论区留字母（A–F）。
tags: [德国跨年, 德国新年, 德国生活, 德国带娃, 德国妈妈, 德国爸爸, 留德, 德国节日]
