    note: 后 3 项是 10 个城市里的名次分。
  - tone: sky
    tag: 托育 · 占 25%
    title: 入托率
    rows:
      - { when: "科隆 64分", name: "3 岁以下 39% · 3–6 岁全天托 89%" }
      - { when: "柏林 62分", name: "3 岁以下 52% · 3–6 岁全天托 60%" }
      - { when: "汉堡 62分", name: "3 岁以下 53% · 3–6 岁全天托 55%" }
      - { when: "慕尼黑 51分", name: "3 岁以下 41% · 3–6 岁全天托 64%" }
    note: 全天托 = 每天 7 小时以上。
  - tone: rose
    tag: 房租负担 · 占 25%
    title: 90 平的房租占收入多少？
    rows:
      - { when: "汉堡 19分", name: "每平米 14 欧 · 占收入 54%" }
      - { when: "科隆 18分", name: "每平米 14 欧 · 占收入 56%" }
      - { when: "慕尼黑 2分", name: "每平米 21 欧 · 占收入 64%" }
