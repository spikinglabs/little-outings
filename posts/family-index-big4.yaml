# A Rednote (小红书) set: which of Germany's four Millionenstädte is best for families, from the Allo Family
# Index (official BBSR INKAR 2025 data 60% + Allo Outings events and OSM places 40%). Method, data and scripts:
# project files family-index/ (METHOD.md, v2/V2.md, v2/absolute.py, v2/absolute_big4.csv). Numbers as of 2026-11-21.
# The posting job cuts the Chinese font itself, so new characters need no font commit.
# History (find a post by its code: grep -l "code: W7KB" posts/):
# - 2026-11-21 L asked for a family-friendly index; only the four big cities; per person/child/family views;
#   the "doable without German" event metric removed; then asked to add it to the admin's Posts panel.
# - L asked for the numbers behind every score, then for one picture with all items' data and scores: card 7 is
#   that picture, drawn by project files family-index/v2/rednote_big4_detail_zh.py.
# - L asked for a longer event window (now 8 Oct 2026 - 18 Feb 2027, all we have) and for absolute scores that
#   don't move when a city is added: every indicator now has fixed 0 and 100 anchors (v2/absolute.py).
#   Hamburg moved to first; the top three are within 1.1 points.
code: W7KB
title: 德国四大城市哪个最适合带娃？
until: 2026-12-31
caption: |
  德国四个百万人口大城市，哪个最适合带娃？我们用官方数据（60%）+ 小鹿出游自己的遛娃数据（40%）比了一下👇

  🥇 汉堡 56.5：房租负担最轻，3 岁以下入托率最高，换尿布点多；但周末亲子活动最少
  🥈 慕尼黑 56.1：最安全、学校好、工作好找；但托育分数最低，绿地最少
  🥉 科隆 55.4：全天托育最普及（3–6 岁 89%），儿科医生最多，亲子活动最多；但交通事故最多
  4️⃣ 柏林 53.6：游乐场、雨天去处和换尿布点都最多；但房租负担最重（90 平房租约占家庭平均收入 75%）

  📏 每一项都按固定标准打分（0–100 分），比如 3 岁以下入托率 60% 得满分、房租占收入 30% 以下得满分。以后加新城市，这四个城市的分数也不会变。

  👉 前三名只差 1.1 分。打分标准上下调 20% 试了 2,000 次：汉堡七成第 1，柏林九成多第 4。按每个孩子算：汉堡、科隆、慕尼黑、柏林。

  🧸 亲子活动看的是 10 月 8 日到 2 月 18 日（我们现有最长的数据），按每 90 天算：每千个孩子 科隆 6.2 场、汉堡和慕尼黑 4.4 场、柏林 2.5 场

  📊 官方数据：托育、房租负担、学校、儿科医生、安全、绿地、工作
  🧸 遛娃数据：亲子活动（数量、周末占比、种类），市中心 5 公里内的游乐场、雨天去处、换尿布点

  ⚠️ 只比城市整体，不比街区；活动数量也受我们收录的活动来源多少影响。

  你住在哪个城市？觉得准不准？评论区聊聊～
  想找身边的亲子活动：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。

  数据来源：BBSR INKAR 2025、小鹿出游活动数据、OpenStreetMap，2026 年 11 月
tags: [德国生活, 德国育儿, 德国带娃, 柏林, 慕尼黑, 汉堡, 科隆, 德国妈妈, 德国爸爸, 留德]
cards:
  - tone: gold
    tag: 带娃城市榜 · 四大城市
    title: "四大城市\n谁最适合\n带娃？"
    big: true
    lines:
      - 柏林、汉堡、慕尼黑、科隆，谁最适合带娃？
      - 官方数据 60% + 小鹿出游遛娃数据 40%，满分 100。
      - 每一项按固定标准打分。
    foot: 德国带娃 · 城市对比
  - tone: paper
    tag: 总排名
    title: 前三名只差 1.1 分
    rows:
      - { when: "1 汉堡", name: "56.5 分" }
      - { when: "2 慕尼黑", name: "56.1 分" }
      - { when: "3 科隆", name: "55.4 分" }
      - { when: "4 柏林", name: "53.6 分" }
    note: 选哪个要看你家最看重什么。
  - tone: rose
    tag: 第 1 名 · 56.5 分
    title: 汉堡 Hamburg
    lines:
      - + 房租负担最轻
      - + 3 岁以下入托率最高：53%
      - + 换尿布点多，树林水边多
      - – 周末的亲子活动最少
  - tone: sky
    tag: 第 2 名 · 56.1 分
    title: 慕尼黑 München
    lines:
      - + 四个城市里最安全
      - + 学校分数最高，没拿到毕业证的学生最少
      - + 失业率最低，工作好找
      - – 托育分数最低，绿地最少
      - – 房租最贵，每平方米 21 欧
  - tone: mint
    tag: 第 3 名 · 55.4 分
    title: 科隆 Köln
    lines:
      - + 全天托育最普及：3–6 岁 89% 的孩子全天入托
      - + 儿科医生最多，休闲绿地最多
      - + 每个孩子分到的亲子活动最多，周末活动也最多
      - – 交通事故最多，安全分最低
  - tone: paper
    tag: 第 4 名 · 53.6 分
    title: 柏林 Berlin
    lines:
      - + 游乐场、雨天去处、换尿布点都最多
      - + 3 岁以下入托率 52%，托育分和汉堡、科隆几乎一样
      - – 房租负担最重：90 平房租约占家庭平均收入 75%
      - – 学校分数最低，失业率最高
  - tone: paper
    tag: 细节数据
    title: 四大城市每一项打几分？
    picture: family-index-big4-detail.png
  - tone: gold
    tag: 怎么打分
    title: 固定标准，不是互相比
    rows:
      - { when: "3岁以下入托", name: "0% 得 0 分 · 60% 得满分" }
      - { when: "房租占收入", name: "80% 得 0 分 · 30% 得满分" }
      - { when: "犯罪", name: "每 10 万人 15,000 起得 0 分 · 2,000 起得满分" }
      - { when: "亲子活动", name: "每千个孩子 90 天 0 场得 0 分 · 10 场得满分" }
      - { when: "游乐场", name: "每平方公里 0 个得 0 分 · 2 个得满分" }
    note: 以后加新城市，分数也不会变。
  - tone: sky
    tag: 托育 · 占 25%
    title: 入托率
    rows:
      - { when: "柏林 76分", name: "3 岁以下 52% · 3–6 岁全天托 60%" }
      - { when: "汉堡 75分", name: "3 岁以下 53% · 3–6 岁全天托 55%" }
      - { when: "科隆 75分", name: "3 岁以下 39% · 3–6 岁全天托 89%" }
      - { when: "慕尼黑 67分", name: "3 岁以下 41% · 3–6 岁全天托 64%" }
    note: 全天托 = 每天 7 小时以上。
  - tone: rose
    tag: 房租负担 · 占 25%
    title: 90 平的房租占收入多少？
    rows:
      - { when: "汉堡 48分", name: "每平米 14 欧 · 占收入 54%" }
      - { when: "科隆 47分", name: "每平米 14 欧 · 占收入 56%" }
      - { when: "慕尼黑 34分", name: "每平米 21 欧 · 占收入 64%" }
      - { when: "柏林 18分", name: "每平米 17 欧 · 占收入 75%" }
    note: 收入 = 家庭平均月净收入，慕尼黑 2,975 欧最高。
  - tone: paper
    tag: 学校 15% · 儿科医生 10%
    title: 学校和儿科医生
    rows:
      - { when: "慕尼黑", name: "没拿到毕业证 5.3% · 儿科医生 6.3" }
      - { when: "科隆", name: "没拿到毕业证 5.8% · 儿科医生 6.8" }
      - { when: "汉堡", name: "没拿到毕业证 6.4% · 儿科医生 6.2" }
      - { when: "柏林", name: "没拿到毕业证 8.0% · 儿科医生 6.2" }
    note: 儿科医生 = 每 1 万个孩子有几位。
  - tone: mint
    tag: 安全 · 占 10%
    title: 犯罪和交通事故
    rows:
      - { when: "慕尼黑 66分", name: "犯罪 5,813 · 交通伤亡 434" }
      - { when: "汉堡 39分", name: "犯罪 11,246 · 交通伤亡 504" }
      - { when: "柏林 32分", name: "犯罪 14,309 · 交通伤亡 444" }
      - { when: "科隆 25分", name: "犯罪 12,481 · 交通伤亡 614" }
    note: 每 10 万居民每年；游客多的城市犯罪数偏高。
  - tone: paper
    tag: 绿地 10% · 工作 5%
    title: 绿地和工作
    rows:
      - { when: "科隆", name: "休闲绿地每人 40 m² · 失业率 8.7%" }
      - { when: "汉堡", name: "休闲绿地每人 35 m² · 失业率 7.4%" }
      - { when: "柏林", name: "休闲绿地每人 33 m² · 失业率 9.1%" }
      - { when: "慕尼黑", name: "休闲绿地每人 26 m² · 失业率 4.5%" }
    note: 汉堡的树林水边最多，每人 51 m²。
  - tone: sky
    tag: 遛娃数据 · 亲子活动
    title: 10 月 8 日到 2 月 18 日
    rows:
      - { when: "科隆 73分", name: "每千个孩子 6.2 场 · 周末 45%" }
      - { when: "慕尼黑 58分", name: "每千个孩子 4.4 场 · 周末 33%" }
      - { when: "汉堡 50分", name: "每千个孩子 4.4 场 · 周末 26%" }
      - { when: "柏林 43分", name: "每千个孩子 2.5 场 · 周末 39%" }
    note: 按每 90 天算；种类最多的是慕尼黑。
  - tone: mint
    tag: 遛娃数据 · 市中心 5 公里
    title: 遛娃去处和换尿布点
    rows:
      - { when: "柏林", name: "游乐场 136 · 雨天去处 33 · 换尿布 174" }
      - { when: "汉堡", name: "游乐场 94 · 雨天去处 19 · 换尿布 133" }
      - { when: "慕尼黑", name: "游乐场 73 · 雨天去处 24 · 换尿布 96" }
      - { when: "科隆", name: "游乐场 82 · 雨天去处 11 · 换尿布 43" }
    note: 雨天去处 = 室内游乐场、博物馆、游泳馆。
  - tone: gold
    tag: 稳不稳？
    title: 换个算法排名变吗？
    rows:
      - { when: "固定标准", name: "汉堡 › 慕尼黑 › 科隆 › 柏林" }
      - { when: "每个孩子", name: "汉堡 › 科隆 › 慕尼黑 › 柏林" }
      - { when: "标准 ±20%", name: "汉堡七成第 1 · 柏林九成多第 4" }
    note: 慕尼黑每 1,000 个孩子只有 1.2 个游乐场。
  - tone: paper
    tag: 看了哪些数据
    title: 数据从哪来？
    lines:
      - 官方数据（60%）：托育、房租负担、学校、儿科医生、安全、绿地、工作，来自德国联邦建筑城市与空间研究所 BBSR。
      - 遛娃数据（40%）：10 月 8 日到 2 月 18 日的亲子活动；市中心 5 公里内的游乐场、雨天去处、换尿布点。
    note: 只比城市整体，不比街区。
  - tone: ink
    tag: 评论区聊聊
    title: 你住在哪个城市？
    lines:
      - 觉得这个排名准不准？
      - 你最看重托育、房租、学校，还是遛娃去处？
    search: 小鹿出游 Allo Outings
    foot: 数据：BBSR INKAR 2025 · 小鹿出游 · OpenStreetMap · 2026-11
