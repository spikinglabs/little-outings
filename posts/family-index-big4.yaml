      - 遛娃数据（40%）：未来 90 天的亲子活动数量、周末占比、种类；市中心 5 公里内的游乐场、雨天去处、换尿布点。
    note: 只比城市整体，不比街区；活动数量也受我们收录的活动来源多少影响。
