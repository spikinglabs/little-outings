# A Rednote (小红书) set: which of Germany's four Millionenstädte and Frankfurt is best for families, from the Allo Family
# Index (official BBSR INKAR 2025 data 75% + OSM places near the centre 25%). Method, data and scripts:
# project files family-index/ (METHOD.md, v2/V2.md, v2/absolute.py, v2/absolute_big4.csv). Numbers as of 2026-11-21.
# History (find a post by its code: grep -l "# - L asked why Frankfurt was missing and to add it: same fixed anchors, so the other four scores did not move.
#   Cut to 10 cards at the same time (Chrome on a phone shares at most 10 pictures, so Post opens the share
#   menu again); the per-item cards are covered by the detail picture (card 8).
code: W7KB
label: 带娃城市榜 · 五大城市（绝对打分）
title: 德国五大城市哪个最适合带娃？
until: 2026-12-31
caption: |
  柏林、汉堡、慕尼黑、科隆、法兰克福，哪个最适合带娃？我们用官方数据（75%）+ 市中心的遛娃去处（25%）比了一下👇

  🥇 汉堡 58.2：房租负担最轻，3 岁以下入托率最高，换尿布点多；但 3–6 岁全天托最少
  🥈 柏林 56.2：游乐场、雨天去处和换尿布点都最多；但房租负担最重（90 平房租约占家庭平均收入 75%）
  🥉 慕尼黑 55.6：最安全、学校好、工作好找；但托育分数最低，每平米租金最贵
  4️⃣ 科隆 51.1：全天托育最普及（3–6 岁 89%），儿科医生最多；但交通事故最多，市中心换尿布点少
  5️⃣ 法兰克福 48.2：托育分数最高（3–6 岁 81% 全天托），小学离家最近；但犯罪最多，绿地和换尿布点最少

  📏 每一项都按固定标准打分（0–100 分），比如 3 岁以下入托率 60% 得满分、房租占收入 30% 以下得满分。加了法兰克福，其他四个城市的分数一分没变。

  🙅 为什么不比亲子活动？我们收录的活动网站每个城市不一样：柏林六成来自天文馆，汉堡七成来自图书馆。数量比的是我们收录了多少，不是城市本身，所以这次不算。

  👉 打分标准上下调 20% 试了 2,000 次：汉堡 97% 第 1，法兰克福每次都是第 5。按每个孩子算：汉堡、科隆、柏林、慕尼黑、法兰克福。

  📊 官方数据：托育、房租负担、学校、儿科医生、安全、绿地、工作
  🛝 遛娃去处：市中心 5 公里内的游乐场、雨天去处、换尿布点

  ⚠️ 只比城市整体，不比街区。

  你住在哪个城市？觉得准不准？评论区聊聊～
  想找身边的亲子活动：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。

  数据来源：BBSR INKAR 2025、OpenStreetMap，2026 年 11 月
tags: [德国生活, 德国育儿, 德国带娃, 柏林, 慕尼黑, 汉堡, 科隆, 法兰克福, 德国妈妈, 德国爸爸, 留德]
