# A Rednote (小红书) save-for-later post: shop opening around Christmas and New Year 2026/27. 24 Dec on a weekday:
# shops close by 14:00 under the state shop-hours laws (IHK München; guides for 2026). 25, 26 Dec and 1 Jan are
# public holidays everywhere; 27 Dec is a Sunday. 31 Dec: 14:00 by law only in Hessen, Bremen and Thüringen
# (IHK München), elsewhere shops set their own hours. 6 Jan a holiday only in Bayern, Baden-Württemberg and
# Sachsen-Anhalt. Everything hedged with "大多数"; no brand names.
# History (find a post by its code: grep -l "code: C7VM" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: C7VM
title: 德国圣诞商店连关3天
until: 2027-01-06
caption: |
  今年 12-25（周五）、12-26（周六）、12-27（周日）商店连关3天🛒 提前收藏，别到时候冰箱空了：

  12-24（周四）平安夜：大多数商店最晚14点关门
  12-25（周五）圣诞节：法定假日，关门
  12-26（周六）圣诞第二天：法定假日，关门
  12-27（周日）：关门
  12-31（周四）：黑森州14点关门，其他州很多店也提前关
  01-01（周五）元旦：法定假日，关门
  01-06（周三）三王节：只在巴伐利亚、巴登-符腾堡、萨克森-安哈尔特放假

  小提示：
  ① 12-23 超市人最多，能早买就早买。
  ② 大火车站里和加油站的小店一般还开，但东西少、价格高。
  ③ 生病买药：有值班药房（Notdienst），门口和网上都能查。

  具体时间以各家店为准。
  🗳 你家一般什么时候去囤货？评论区留字母（A–F）。
tags: [德国生活, 德国圣诞, 商店营业时间, 德国带娃, 德国妈妈, 德国爸爸, 留德, 德国新年]
