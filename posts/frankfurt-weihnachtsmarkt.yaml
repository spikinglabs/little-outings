# A Rednote (小红书) set: Frankfurt's Christmas market for families. Frankfurt has one big market over several
# squares, so the vote is over the children's shows on the Christmas boat at the Mainkai instead of over markets.
# Every date, time and offer from the organiser's official page (visitfrankfurt.travel/en/experience/festival-and-events/
# frankfurt-christmas-market/All, Tourismus+Congress GmbH, read 2026-11-13); changing tables from OpenStreetMap
# (places/toilets.jsonl, 2026-11-12).
# Drawn and uploaded by .github/workflows/posts.yml on push; the admin's Posts panel opens it by its code.
# Ends on a vote so parents talk in the comments (public: ask for favourites and tips, never about their kids).
# History (find a post by its code: grep -l "code: FA5E" posts/):
# - 2026-11-12 held back: no official 2026 children's programme yet (frankfurt.de blocks reads, tourism URLs 404).
# - 2026-11-13 L: the Christmas market posts are missing Frankfurt. The official page now lists the children's
#   market and the boat programme, so this set is built from it. No brand names; performers named by kind of show.
# - 2026-11-13 L asked to try video posts; this post's 28 s video (the `video:` block below) was the sample, L: "看起来可以".
code: FA5E
title: 法兰克福圣诞市场带娃攻略｜2026
until: 2026-12-22
caption: |
  法兰克福圣诞市场 11-23（周一）开门，到 12-22🎄 今年美因河边有专门的儿童圣诞市场，河边的圣诞船上几乎每天下午都有孩子的节目。按官方节目单整理好了，看完来评论区投票（A–F）👇

  A 讲童话：白雪公主、灰姑娘、霍勒大妈……
  B 儿童音乐会：一起唱、一起跳
  C 互动童话剧：孩子换上戏服一起演
  D 魔术秀
  E 剧场故事
  F 唱圣诞歌的儿童秀

  具体日期见第5–7张。12-06（周日）17:10 尼古拉斯来罗马广场舞台。

  🗳 你家最想看哪个？评论区留字母就行。
  也想听听大家的经验：法兰克福带娃白天去还是晚上去？推车好走吗？有没有人少的小角落？

  节目单官方还会更新，出发前请再确认～
  更多市场：浏览器搜索「小鹿出游 Allo Outings」，选法兰克福，点「圣诞市场」。
