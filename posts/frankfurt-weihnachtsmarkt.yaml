  - tone: green
    tag: 儿童圣诞市场
    title: 美因河边的孩子专区
    lines:
      - 在 Eiserner Steg 铁桥东边的美因河岸：儿童旋转木马、小摩天轮、圣诞手工坊。
      - 100棵圣诞树，是法兰克福小学和幼儿园的孩子装饰的。
      - 历史博物馆外墙变成大大的降临日历，每天17点开一扇门。
  - tone: sky
    tag: 圣诞船
    title: 船上的孩子节目
    lines:
      - 停在 Eiserner Steg 旁边的灯光船上，有童话、音乐会、魔术和剧场。
      - 不能带自己的吃的喝的上船。
      - 有几场有手语翻译：11-24、12-02、12-10、12-18。
    note: 下面三张是每类节目的日期。
  - tone: rose
    tag: A 讲童话 · B 音乐会
    title: 听故事，一起唱
    lines:
      - A 讲童话：11-24、12-01、12-08、12-15、12-22 16点；周日 11-29、12-06、12-13、12-20 13点和15点。
      - B 儿童音乐会：11-25、12-03、12-09、12-11、12-14、12-21 16点；12-19 13点和15点。
  - tone: mint
    tag: C 童话剧 · D 魔术
    title: 一起演，看魔术
    lines:
      - C 互动童话剧：孩子换上戏服一起演，11-23、11-30、12-02、12-07 都是16点。
      - D 魔术秀：11-28（周六）13点和15点，12-18 16点。
  - tone: sky
    tag: E 剧场 · F 儿童秀
    title: 剧场和圣诞歌
    lines:
      - E 剧场故事：12-05、12-12（周六）13点和15点，12-16 16点。
      - F 儿童秀：唱圣诞歌、跳舞、变魔术，11-26、11-27、12-10、12-17 都是16点。
  - tone: red
    tag: 别错过
    title: 尼古拉斯和老火车
    lines:
      - 12-06（周日）17:10 尼古拉斯来罗马广场舞台。
      - 12-12、12-13：老火车从 Eiserner Steg 出发，在城里绕一圈。
      - 每周三、周六18点，圣尼古拉教堂屋顶上吹圣诞号角。
  - tone: paper
    tag: 换尿布 · 小提示
    title: 宝宝要换尿布？
    lines:
      - 罗马广场：约90米的公共厕所有单独的换尿布间（收费，6–23:45点）。
      - Hauptwache：附近书店有换尿布间（约180米，周日不开）。
      - 儿童游乐设施那里可以免费领防走失手环，写上手机号。
    note: 晚上人多推车难走，背带更轻松。
