# A Rednote (小红书) explainer: German New Year lucky charms (Glücksbringer) that families give each other and kids
# see in shops around 31 Dec: chimney sweep, lucky pig (often marzipan), four-leaf clover, horseshoe, fly agaric,
# ladybird, lucky cent. General custom, no brands.
# History (find a post by its code: grep -l "code: D9RU" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: D9RU
title: 德国新年为什么送小猪
until: 2027-01-03
caption: |
  德国跨年前后，商店里突然到处是小猪、四叶草和烟囱清扫工🐷🍀 这些都是新年的幸运符（Glücksbringer），德国人互相送，祝新年好运：

  🐷 幸运猪：常见的是杏仁糖（Marzipan）做的小猪。“Schwein gehabt”就是“走运了”。
  🧹 烟囱清扫工：以前烟囱通了，家里才暖和安全；新年碰到他，据说一年好运。
  🍀 四叶草：难找，所以代表幸运。
  🧲 马蹄铁：挂在门上保平安。
  🍄 毒蝇伞（红底白点的蘑菇）：只做装饰和图案，真的蘑菇有毒，别让孩子摘。
  🐞 七星瓢虫、幸运硬币也常见。

  可以和孩子一起做小卡片，画上这些图案送给邻居和老师。

  🗳 你觉得哪个最可爱？评论区留字母（A–F）。
