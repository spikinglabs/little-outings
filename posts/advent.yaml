# A Rednote (小红书) explainer: the four Advent Sundays and the customs around them (Adventskranz, Adventskalender,
# Barbarazweige on 4 Dec). Dates from the 2026 calendar: Christmas Day is a Friday, so Advent Sundays are
# 11-29, 12-06, 12-13, 12-20. The Advent calendar itself has its own post (AK7D), so it is only mentioned here.
# History (find a post by its code: grep -l "code: W3XB" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: W3XB
title: 德国降临节4根蜡烛怎么点
until: 2026-12-20
caption: |
  德国的圣诞季从“降临节”（Advent）开始：圣诞前的4个星期天，每周多点一根蜡烛🕯️ 今年的4个降临节星期天是：

  第1个 11-29（周日）
  第2个 12-06（周日，也是尼古拉斯节）
  第3个 12-13（周日）
  第4个 12-20（周日）

  ① 降临节花环（Adventskranz）：常青枝编成圈，上面4根蜡烛，第1周点1根，第2周点2根……
  ② 降临日历（Adventskalender）：12-01 到 12-24，每天开一个小门。
  ③ 12-04 剪 Barbarazweig：剪一根樱桃树枝插在水里放在屋里，传说圣诞节开花会带来好运。
  ④ 很多家庭这几个周末一起烤饼干、去圣诞市场。

  点蜡烛时别离开房间，干枝子很容易着火。

  🗳 你家今年准备做哪个？评论区留字母（A–F）。
