caption: |
  德国冬天带娃，下午四点天就黑了，主要靠意志力😂

  🧥 雪服帽子围巾手套雪靴，穿完说要上厕所
  🌃 “现在是晚上了吗？”才四点半
  🛷 雪只有两厘米，雪橇滑得很认真
  🏰 雨天在家，沙发变成了城堡

  好消息：圣诞市场开了🎄 想找冬天的室内去处：浏览器搜索「小鹿出游 Allo Outings」。

  你家冬天带娃去哪？评论区聊聊～
