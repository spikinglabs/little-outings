# A Rednote (小红书) explainer: buying a Christmas tree in Germany with kids. General advice: Nordmanntanne is the
# most common tree (soft needles, keeps them long), Blaufichte and Fichte cheaper/prickly or shed sooner; farms
# offer cutting your own in December; cities collect trees in January on dates that differ by town (told to check).
# No prices (they vary), no farm or shop names.
# History (find a post by its code: grep -l "code: X7TG" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: X7TG
title: 在德国买圣诞树怎么选
until: 2026-12-20
caption: |
  德国家庭一般12月中买圣诞树，很多家庭会带孩子一起去挑🌲 第一次买可以看看：

  ① 最常见的是 Nordmanntanne：针软不扎手，掉针慢，放到1月也还行。
  ② Blaufichte 颜色偏蓝、针硬扎手；Fichte 便宜，但掉针快。
  ③ 挑的时候轻轻抖一抖，掉针多的不要；看切口是不是新鲜。
  ④ 很多农场12月开放“自己砍树”（Weihnachtsbaum selber schlagen），带上手套，孩子很喜欢。
  ⑤ 回家先放在阳台或凉快的地方，网先别拆；用能加水的树架，记得每天加水。
  ⑥ 1月城市会统一收旧树，日期每个城市不一样，装饰要全部拿掉。

  🗳 你家今年怎么选？评论区留字母（A–F）。
