code: Q6JY
label: 搞笑 带娃 · 娃语翻译词典
title: 娃语翻译词典，建议收藏
caption: |
  学了这么多年外语，最难的一门是娃语😂 整理了一本《娃语翻译词典》👇

  😴「我不困」= 三分钟内会睡着
  🙋「我自己来」= 接下来二十分钟，请不要催
  🍽️「我不饿」= 等你开始吃，他就饿了
  🤫 突然很安静 = 赶紧去看看
  🧱「是它自己掉的」= 嗯……
  🥰「你是全世界最好的爸爸/妈妈」= 刚刚多看了一集动画片

  反过来，大人说的话，娃是这么听的：
  「最后一次」= 还有很多次
  「小心点」= 请加速

  翻到最后发现，只有一句不用翻译：我爱你❤️

  你家娃还有哪些神翻译？评论区补充～
