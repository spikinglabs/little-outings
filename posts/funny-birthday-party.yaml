code: DNVA
label: 搞笑 带娃 · 办儿童生日派对
title: "给娃办生日派对，大人先累倒"
caption: |
  给娃办生日派对：两个小时的派对，准备了两个星期😂

  🦖 蛋糕要恐龙的，还要独角兽，还要粉红色
  🙈 小朋友都到了，寿星躲在桌子底下：“我害羞。”
  📦 精心准备的游戏，最受欢迎的是装礼物的大纸箱
  🙌 结束后两个大人瘫在沙发上，互相击掌

  寿星说：“这是最好的生日！”所有的累都消失了🎂

  你给娃办过什么样的派对？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
