code: H3MZ
title: 慕尼黑圣诞儿童剧｜2026
until: 2026-12-24
caption: |
  慕尼黑今年圣诞季给孩子看的剧和音乐会，按主办方节目单挑了6个🎄 圣诞市场的儿童活动在之前那篇。

  A Münchner Theater für Kinder：11-27 到 01-10 多场，15点。Eine kleine Weihnachtsgeschichte，小小圣诞故事。
  B Tierpark Hellabrunn 动物园：12-06（周日）10–12点。尼古拉斯来动物园。
  C Münchner Marionettentheater：12-12、12-13 14点。提线木偶演狄更斯的《圣诞颂歌》。
  D Galli Theater 互动剧：12-21 到 12-24 16点。圣诞故事，孩子可以上台一起演。
  E Alte Kongresshalle 儿童芭蕾：12-20（周日）14点。孩子们跳的《胡桃夹子》。
  F Gasteig HP8 儿童音乐会：12-13（周日）16点。mini.musik 系列：Ein Engel fällt aus allen Wolken。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选慕尼黑。

  🗳 你家最想去哪个？评论区留字母（A–F）。
