  - tone: paper
    tag: A 大教堂 · B 老城
    title: 经典两个，挨着逛
    lines:
      - A 大教堂（Roncalliplatz）：老式旋转木马、木偶剧、手工、画脸。周日到周三11–21点，周四到周六开到22点。
      - B 老城 Heinzels（Alter Markt + Heumarkt）：Heumarkt 上有溜冰场，还有给孩子的小摩天轮和旋转木马。
    note: 老城的 Heumarkt 开到1月10日，圣诞后还能去溜冰。
  - tone: paper
    tag: C 港口市场
    title: 小火车和大摩天轮
    lines:
      - 在巧克力博物馆旁边，11-13最早开门。
      - 儿童旋转木马、儿童小火车，还有50米高的摩天轮。
      - 每周二有画脸和寻宝游戏。
    note: 圣诞后是新年市场，开到1月3日。
  - tone: paper
    tag: D Rudolfplatz · E Neumarkt
    title: 小小孩最爱
    lines:
      - D 尼古拉斯村（Rudolfplatz）：有暖气的尼古拉斯小屋，孩子可以在工作人员陪同下免费做手工、画画。
      - E Neumarkt：能见到 Elsa 和 Anna 等童话人物，还有画脸、魔术和圣尼古拉斯来访。
    note: 两个市场走路10分钟左右，冷了就进小屋暖和一下。
  - tone: paper
    tag: F 还有这些
    title: 下雨天和小众的
    lines:
      - F Köln-West（Ehrenfeld）：部分有顶棚和暖气，有儿童旋转木马，还计划有溜冰场。
      - Eigelstein（12-02到12-06）：圣尼古拉斯每天16点来。
      - Wachsfabrik（Rodenkirchen，只有12月周末）：动手工作坊、家庭剧场和童话人物。
  - tone: paper
    tag: 换尿布 · 厕所
    title: 宝宝要换尿布？
    lines:
      - 大教堂：对面的 Domforum 有换尿布台，约130米，开到17点。
      - Neumarkt 和 Rudolfplatz：附近药妆店有换尿布台，约100米，周一到周六开到20点。
      - 热饮杯要付押金（Pfand），还杯退钱，也可以留着做纪念。
    note: 晚上人多推车难走，背带更轻松。
