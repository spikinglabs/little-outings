caption: |
  带娃逛超市，进去买牛奶，出来带了一车别的😂

  🛒 要坐购物车，两分钟后要自己推，三米后撞到土豆
  🥦 偷偷放进车里：饼干、塑料剑，和一棵西兰花
  ⭐ 结账口危机，被收银员的一张贴纸解除
  🥛 计划买牛奶，最后忘了买牛奶

  明天再去一次，这次一个人去🏃

  你家娃在超市干过什么？评论区聊聊～
