code: N6KD
title: 德国12月6日尼古拉斯节是什么
until: 2026-12-06
caption: |
  12-05 晚上，德国的孩子会把擦干净的靴子放在门口；12-06（今年是周日）早上，靴子里会有巧克力、橘子和坚果。这就是尼古拉斯节（Nikolaustag）🎅

  ① 圣尼古拉斯是4世纪 Myra（在今天的土耳其）的主教，传说他偷偷帮助穷人家的孩子。
  ② 前一晚要把靴子擦干净，擦得越干净越好。
  ③ 有的地方尼古拉斯身边跟着 Knecht Ruprecht，一身黑衣服。
  ④ 幼儿园和学校常常在这几天请“尼古拉斯”来，给孩子发小袋子。
  ⑤ 超市里的巧克力尼古拉斯就是为这一天准备的。

  不是法定假日，商店照常营业（今年 12-06 是周日，商店本来就关门）。

  🗳 你家靴子里一般放什么？评论区留字母（A–F）。
