# A Rednote (小红书) discussion post: how parents help kids sit calmly and feel at ease in the car (car seat, long
# drives). Mostly an invitation to share; the few safety facts are checked, and the tips are written as common
# practice ("大家常用的办法"), not as advice we vouch for. No brands, no questions about anyone's kids.
# History (find a post by its code: grep -l "code: CR7H" posts/):
# - 2026-11-25 L: "做一个大家讨论的小红书帖子，让大家分享如何让小朋友安心坐车的话题". Written with these sources:
#   - § 21 Abs. 1a StVO: children under 12 who are smaller than 150 cm ride in a child seat (ADAC
#     "Kindersitzpflicht": https://www.adac.de/verkehr/verkehrssicherheit/kindersicherheit/kindersitzberater/kindersitzpflicht/ ).
#   - UN R129 (i-Size): rear-facing at least until 15 months (ADAC "Kindersitz-Normen":
#     https://www.adac.de/verkehr/verkehrssicherheit/kindersicherheit/kindersitzberater/kindersitz-normen/ ).
#     Said for i-Size seats only, since older R44 seats are still allowed in use.
#   - ADAC "Warum die Winterjacke beim Autofahren gefährlich ist"
#     (https://www.adac.de/verkehr/verkehrssicherheit/wetter/winterjacke-auto/ ): padded jackets leave the belt
#     loose; take the jacket off, buckle up, then a jacket or blanket over the belt.
#   - Stop before taking a crying child out of the seat, and soft toys rather than hard ones: general safety
#     sense, worded as what to do, with no figures.
code: CR7H
label: 安心坐车 · 家长经验交流
title: 娃一上车就哭闹？大家都怎么办
caption: |
  娃一上车就哭、扭、想下来？一起聊聊怎么让小朋友安心坐车🚗

  ① 先说安全：在德国，12 岁以下、身高不到 150 厘米的孩子，坐车要用儿童座椅（StVO §21）。i-Size（R129）座椅至少到 15 个月要反向安装。
  ② 冬天注意：厚外套会让安全带系不紧。先脱外套、系好安全带，再把外套或毯子盖在上面（ADAC）。
  ③ 出发前：有的家长挑孩子平时睡觉的时间出发；先告诉孩子去哪、要坐多久；上车前换好尿布或上过厕所。
  ④ 路上：听儿歌和故事，一起找窗外的车和动物，带软一点的小玩具。
  ⑤ 长途：开一段就找休息站停一停，下车活动一下。孩子哭得厉害，先找地方停车，再把孩子抱出座椅。

  💬 你家有什么让孩子安心坐车的小办法？长途开车有什么经验或趣事？评论区分享一下，帮到更多家长。
