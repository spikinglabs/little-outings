# A Rednote (小红书) explainer: Sternsinger around 6 January. Facts from sternsinger.de (Kindermissionswerk / BDKJ,
# Aktion Dreikönigssingen): children dressed as the three kings bring the blessing C+M+B ("Christus mansionem
# benedicat") written in chalk with the year and collect for children's projects worldwide; the 2027 theme is
# healthy food for children, example country Guatemala. 6 Jan is a public holiday in Bayern, Baden-Württemberg
# and Sachsen-Anhalt. The 2027 chalk line follows the published pattern (20*C+M+B+26 in 2026).
# History (find a post by its code: grep -l "code: M4WK" posts/):
# - 2026-11-21 written with its video block (20 video posts for L).
code: M4WK
title: 门上的20*C+M+B+27是什么
until: 2027-01-06
caption: |
  1月初在德国，可能会有一群戴王冠的孩子来按门铃⭐ 他们是“星星歌者”（Sternsinger）：

  ① 孩子们扮成东方三王，举着星星挨家挨户唱歌、祝福。
  ② 他们在门框上用粉笔写 20*C+M+B+27：C+M+B 是拉丁语“基督保佑这个家”，前后是年份。
  ③ 同时为世界各地的孩子募捐，2027年的主题是儿童健康饮食。
  ④ 大多在 01-06 三王节前后几天，由当地天主教堂区组织，愿意的话可以开门、听歌、自愿捐款。
  ⑤ 01-06 在巴伐利亚、巴登-符腾堡、萨克森-安哈尔特是法定假日。

  门上的粉笔字一般留一整年，不用擦。

  🗳 你家孩子更想当哪个？评论区留字母（A–F）。
