label: 搞笑 带娃 · 娃的画作解读
title: "看懂娃的画，需要说明书"
caption: |
  看懂娃的画需要说明书，每一幅都是抽象派大作🎨

  ⭕ 一个大圆圈四根线：“这是爸爸。”一个小点：“这是我，我在远处。”
  🚗 我们猜是一只狗，实际是我们家的车
  😆 画在纸上 30%，桌子上 30%，自己脸上 40%
  🎂 “这不是乱画的，是一场下雨的生日派对。”

  每一张都舍不得扔，冰箱挂满了就拍下来📸

  你家娃画过什么看不懂的？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
