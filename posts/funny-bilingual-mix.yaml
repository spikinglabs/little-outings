caption: |
  双语娃说话，全家都需要翻译😂

  🍎 “这个 Apfel 好 lecker 啊！”
  🐌 自创新词：“Schnecke 牛”
  📱 奶奶问：Kita 是什么？娃：“就是 Kita 啊。”
  🎁 想要东西的时候，哪种语言好用就用哪种

  混着说没关系，慢慢地两种语言都会长得很好🌱

  你家娃说过什么混搭金句？评论区聊聊～
