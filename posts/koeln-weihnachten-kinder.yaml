code: V2JC
title: 科隆圣诞儿童演出｜2026
until: 2026-12-24
caption: |
  科隆今年圣诞季给孩子看的演出，按主办方节目单挑了6个，日期时间都写好了🎄

  A Hänneschen-Theater 木偶剧：11-25 到 12-20 多场，15点。科隆方言的圣诞木偶剧 E Leech zom Chressfess，在 Altstadt 的 Eisenmarkt。
  B Kölner Philharmonie 家庭音乐会：12-13（周日）14点。Das Geheimnis der Weihnachtswichtel，圣诞小精灵的故事。
  C Volksbühne am Rudolfplatz：12-13、12-20、12-23、12-24 11点。天使和驴讲圣诞故事 Die Weihnachtsgeschichte。
  D Kulturkirche 儿童圣诞音乐会：12-04（周五）15点。科隆本地给孩子唱歌的乐队，圣诞专场。
  E MAKK 博物馆手工：12-12（周六）14点。做冬天的喂鸟小屋，要提前报名。
  F Kölner Weihnachtscircus 圣诞马戏：11-27 到 01-03 多场。在 Palastzelt，时间看官网。

  12-24（周四）15点 Kölner Philharmonie 还有一场 Wir warten aufs Christkind，平安夜下午等圣诞的音乐会。

  时间和票价以主办方为准，出发前请再确认。
  更多活动：浏览器搜索「小鹿出游 Allo Outings」，选科隆。

  🗳 你家最想去哪个？评论区留字母（A–F）。
