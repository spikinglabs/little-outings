title: "娃的谈判技巧，可以去上班了"
caption: |
  娃的谈判技巧，可以直接去上班了😂

  🤝 再玩五分钟？“那七分钟，最后一次。”
  👵 爸爸说不行问妈妈，妈妈说不行问奶奶
  🥺 “我只是一个小孩子。”这一招基本没输过
  📜 “你上次说下雨就可以看动画片。今天在下雨。”

  将来可以当律师，我们先输几年😅

  你家娃最厉害的谈判招数？评论区聊聊～
  周末想带娃出门：浏览器搜索「小鹿出游 Allo Outings」，选你的城市。
